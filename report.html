<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDS Report System</title>

<style>

body{
  font-family:Arial;
  margin:0;
  padding:20px;
  background:linear-gradient(135deg,#064e3b,#022c22);
  color:white;
  text-align:center;
}

/* BOX */
.box{
  background:white;
  color:black;
  padding:15px;
  margin:10px auto;
  border-radius:12px;
  max-width:900px;
}

/* INPUT */
input{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

/* BUTTON */
button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#3498db;
  color:white;
  cursor:pointer;
  margin:5px;
}

button:hover{opacity:0.85}

/* INFO */
.info{
  background:white;
  color:black;
  padding:10px;
  border-radius:10px;
  margin:10px auto;
  font-weight:bold;
  max-width:900px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  background:white;
  color:black;
}

th,td{
  border:1px solid #000;
  padding:8px;
  text-align:left;
}

th{background:#f2f2f2}

/* POPUP */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:20px;
  width:320px;
  border-radius:10px;
  display:none;
  z-index:2000;
  pointer-events:auto;
}

/* LOADING */
#loading{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:1500;
  pointer-events:none;
}

.spinner{
  width:60px;
  height:60px;
  border:6px solid #ccc;
  border-top:6px solid #2ecc71;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

</style>
</head>

<body>

<h2>📄 MDS Report System</h2>

<div class="box">
  <label>Tarikh:</label><br>
  <input type="date" id="tarikh"><br><br>

  <button onclick="loadMesyuarat()">🔍 Cari Report</button>
  <button onclick="downloadPDF()">📥 PDF</button>
</div>

<div class="info">
📌 Mesyuarat: <span id="mesyuarat">-</span><br>
📅 Tarikh: <span id="tarikhInfo">-</span>
</div>

<div class="box">
<table>
<thead>
<tr>
<th>Bil</th>
<th>Nama</th>
<th>Jawatan</th>
<th>Bahagian</th>
<th>Tarikh</th>
<th>Masa</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
<h3>Pilih Mesyuarat</h3>
<div id="list"></div>
<button onclick="closePopup()">Tutup</button>
</div>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <div>Loading...</div>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyopvrbNo2AJTyWgK0cHdANFNaTdAleIhJGaWxRD8-ETrti3VsekQwG32_uj3GfMgzihw/exec";

const popup = document.getElementById("popup");

/* LOGIN CHECK */
if(sessionStorage.getItem("mds_login") !== "true"){
  alert("Sila login dahulu");
  window.location.href="login.html";
}

/* LOADING SAFE */
function showLoading(){
  document.getElementById("loading").style.display="flex";
}

function hideLoading(){
  document.getElementById("loading").style.display="none";
}

/* SAFE FETCH (CORS FRIENDLY) */
async function postAPI(payload){

  try{
    let res = await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"application/x-www-form-urlencoded"
      },
      body:new URLSearchParams(payload)
    });

    return await res.json();

  }catch(err){
    console.log(err);
    return [];
  }
}

/* LOAD MESYUARAT */
async function loadMesyuarat(){

  let tarikh = document.getElementById("tarikh").value;
  if(!tarikh){
    alert("Sila pilih tarikh");
    return;
  }

  showLoading();

  document.getElementById("tarikhInfo").innerText = formatDate(tarikh);

  let data = await postAPI({
    action:"listMesyuarat",
    tarikh:tarikh
  });

  hideLoading();

  let list = document.getElementById("list");
  list.innerHTML = "";

  if(!data || data.length === 0){
    list.innerHTML = "<p>Tiada mesyuarat</p>";
    popup.style.display="block";
    return;
  }

  data.forEach(m=>{
    let btn = document.createElement("button");
    btn.innerText = m;
    btn.onclick = ()=>loadReport(m);
    list.appendChild(btn);
  });

  popup.style.display="block";
}

/* REPORT */
async function loadReport(mesyuarat){

  popup.style.display="none";
  showLoading();

  document.getElementById("mesyuarat").innerText = mesyuarat;

  let tarikh = document.getElementById("tarikh").value;

  let data = await postAPI({
    action:"report",
    tarikh:tarikh,
    mesyuarat:mesyuarat
  });

  hideLoading();

  let tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  if(!data || data.length === 0){
    tbody.innerHTML = "<tr><td colspan='7'>Tiada data</td></tr>";
    return;
  }

  let html = "";

  data.forEach((r,i)=>{
    html += `
    <tr>
      <td>${i+1}</td>
      <td>${r.nama || "-"}</td>
      <td>${r.jawatan || "-"}</td>
      <td>${r.bahagian || "-"}</td>
      <td>${r.tarikh || "-"}</td>
      <td>${r.masa || "-"}</td>
      <td>${r.status || "-"}</td>
    </tr>`;
  });

  tbody.innerHTML = html;
}

/* PDF */
async function downloadPDF(){

  let tarikh = document.getElementById("tarikh").value;
  let mesyuarat = document.getElementById("mesyuarat").innerText;

  if(!tarikh || mesyuarat === "-"){
    alert("Sila pilih tarikh & mesyuarat");
    return;
  }

  showLoading();

  let res = await postAPI({
    action:"pdf",
    tarikh:tarikh,
    mesyuarat:mesyuarat
  });

  hideLoading();

  if(res && res.url){
    window.open(res.url,"_blank");
  }else{
    alert("Gagal generate PDF");
  }
}

/* FORMAT DATE FIXED */
function formatDate(d){

  if(!d) return "";

  if(d.includes("-")){
    let p = d.split("-");
    return `${p[2]}/${p[1]}/${p[0]}`;
  }

  return d;
}

/* POPUP CLOSE FIX */
function closePopup(){
  document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
