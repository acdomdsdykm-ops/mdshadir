<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Kehadiran MDS</title>

<style>
body{
  font-family:Arial;
  margin:0;
  padding:20px;
  min-height:100vh;
  background:linear-gradient(135deg,#064e3b,#022c22);
  color:white;
  text-align:center;
}

.box{
  background:white;
  color:black;
  padding:15px;
  margin:10px;
  border-radius:12px;
}

input{
  padding:10px;
  margin:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#3498db;
  color:white;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  background:white;
  color:black;
}

th,td{
  border:1px solid #000;
  padding:8px;
  text-align:left;
}

th{
  background:#f2f2f2;
}

/* POPUP */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:20px;
  width:320px;
  border-radius:10px;
  display:none;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.popup button{
  width:100%;
  margin-top:8px;
}

/* PRINT */
@media print{
  button,.popup{
    display:none !important;
  }

  body{
    background:white;
    color:black;
  }
}
</style>
</head>

<body>

<h2>📄 Laporan Kehadiran MDS</h2>

<div class="box">

<label>Tarikh:</label><br>
<input type="date" id="tarikh"><br>

<button onclick="loadMesyuarat()">🔍 Cari Report</button>
<button onclick="window.print()">🖨️ Print PDF</button>

</div>

<!-- POPUP -->
<div id="popup" class="popup">
<h3>📌 Pilih Mesyuarat</h3>
<div id="list"></div>
<button onclick="closePopup()">Tutup</button>
</div>

<!-- TABLE -->
<div class="box">
<table>
<thead>
<tr>
<th>Bil</th>
<th>Nama</th>
<th>Jawatan</th>
<th>Masa</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbyLDt7eLt3-3KXd15xgoVVOEHM6wwY-q3eRsTjYs7gU57TQgOwOaFOkMY-wxxkvFbpUOw/exec";

/* LOAD LIST MESYUARAT */
function loadMesyuarat(){

if(!tarikh.value){
alert("Sila pilih tarikh");
return;
}

fetch(API,{
method:"POST",
headers:{"Content-Type":"text/plain"},
body:JSON.stringify({
action:"listMesyuarat",
tarikh:tarikh.value
})
})
.then(r=>r.json())
.then(data=>{

let list=document.getElementById("list");
list.innerHTML="";

if(!data || data.length===0){
list.innerHTML="<p>Tiada mesyuarat</p>";
popup.style.display="block";
return;
}

data.forEach(m=>{
let btn=document.createElement("button");
btn.style.width="100%";
btn.style.margin="5px 0";
btn.innerText=m;

btn.onclick=()=>loadReport(m);

list.appendChild(btn);
});

popup.style.display="block";

})
.catch(()=>{
alert("Ralat load mesyuarat");
});

}

/* LOAD REPORT */
function loadReport(mesyuarat){

popup.style.display="none";

fetch(API,{
method:"POST",
headers:{"Content-Type":"text/plain"},
body:JSON.stringify({
action:"report",
tarikh:tarikh.value,
mesyuarat:mesyuarat
})
})
.then(r=>r.json())
.then(data=>{

let tbody=document.getElementById("tbody");
tbody.innerHTML="";

if(!data || data.length===0){
tbody.innerHTML="<tr><td colspan='4'>Tiada data kehadiran</td></tr>";
return;
}

data.forEach((r,i)=>{

tbody.innerHTML += `
<tr>
<td>${i+1}</td>
<td>${r.nama || "-"}</td>
<td>${r.jawatan || "-"}</td>
<td>${r.masa || "-"}</td>
</tr>
`;

});

})
.catch(()=>{
alert("Ralat load report");
});

}

/* CLOSE POPUP */
function closePopup(){
popup.style.display="none";
}

</script>

</body>
</html>
