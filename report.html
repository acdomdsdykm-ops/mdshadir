<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDS Report System</title>

<style>
body{
  font-family:Arial;
  margin:0;
  padding:20px;
  background:linear-gradient(135deg,#064e3b,#022c22);
  color:white;
  text-align:center;
}

.box{
  background:white;
  color:black;
  padding:15px;
  margin:10px;
  border-radius:12px;
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#3498db;
  color:white;
  cursor:pointer;
  margin:5px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  background:white;
  color:black;
}

th,td{
  border:1px solid #000;
  padding:8px;
  text-align:left;
}

th{
  background:#f2f2f2;
}

.info{
  background:white;
  color:black;
  padding:10px;
  border-radius:10px;
  margin:10px;
  font-weight:bold;
}

/* POPUP */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:20px;
  width:320px;
  border-radius:10px;
  display:none;
  z-index:999;
}

.popup button{
  width:100%;
  margin-top:8px;
}

/* PRINT */
@media print{
  button,.popup{
    display:none !important;
  }
  body{
    background:white;
    color:black;
  }
}
</style>
</head>

<body>

<h2>📄 MDS Report System</h2>

<!-- INPUT -->
<div class="box">
  <label>Tarikh:</label><br>
  <input type="date" id="tarikh"><br><br>

  <button onclick="loadMesyuarat()">🔍 Cari Report</button>
  <button onclick="downloadPDF()">📥 Print PDF</button>
</div>

<!-- INFO -->
<div class="info">
📌 Mesyuarat: <span id="mesyuarat">-</span><br>
📅 Tarikh: <span id="tarikhInfo">-</span>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
<h3>Pilih Mesyuarat</h3>
<div id="list"></div>
<button onclick="popup.style.display='none'">Tutup</button>
</div>

<!-- TABLE -->
<div class="box">
<table>
<thead>
<tr>
<th>Bil</th>
<th>Nama</th>
<th>Jawatan</th>
<th>Bahagian</th>
<th>Tarikh</th>
<th>Masa</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwfzwNeo3B-cTaLA39qfImRA5c5_9owyOiPcleoZt4-dby4B9d4Kr_ZBtoqtVdwIYdMXg/exec";

const popup = document.getElementById("popup");
const tarikhEl = document.getElementById("tarikh");

/* =========================
   SAFE API CALL
========================= */
async function postAPI(payload){

  try{
    const res = await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"application/x-www-form-urlencoded"
      },
      body:new URLSearchParams(payload)
    });

    return await res.json();

  }catch(err){
    console.error(err);
    alert("Ralat sambungan API");
    return null;
  }
}

/* =========================
   LOAD MESYUARAT
========================= */
async function loadMesyuarat(){

if(!tarikhEl.value){
alert("Sila pilih tarikh");
return;
}

document.getElementById("tarikhInfo").innerText = tarikhEl.value;

let data = await postAPI({
  action:"listMesyuarat",
  tarikh:tarikhEl.value
});

let list=document.getElementById("list");
list.innerHTML="";

if(!Array.isArray(data) || data.length===0){
list.innerHTML="Tiada mesyuarat";
popup.style.display="block";
return;
}

data.forEach(m=>{
let btn=document.createElement("button");
btn.innerText=m;

btn.onclick=()=>loadReport(m);

list.appendChild(btn);
});

popup.style.display="block";
}

/* =========================
   LOAD REPORT
========================= */
async function loadReport(mesyuarat){

popup.style.display="none";

document.getElementById("mesyuarat").innerText = mesyuarat;

let data = await postAPI({
  action:"report",
  tarikh:tarikhEl.value,
  mesyuarat:mesyuarat
});

let tbody=document.getElementById("tbody");
tbody.innerHTML="";

if(!Array.isArray(data) || data.length===0){
tbody.innerHTML="<tr><td colspan='7'>Tiada data</td></tr>";
return;
}

data.forEach((r,i)=>{
tbody.innerHTML += `
<tr>
<td>${i+1}</td>
<td>${r.nama || "-"}</td>
<td>${r.jawatan || "-"}</td>
<td>${r.bahagian || "-"}</td>
<td>${r.tarikh || "-"}</td>
<td>${r.masa || "-"}</td>
<td>${r.status || "-"}</td>
</tr>
`;
});

}

/* =========================
   PRINT PDF (APPS SCRIPT)
========================= */
async function downloadPDF(){

let tarikh = tarikhEl.value;
let mesyuarat = document.getElementById("mesyuarat").innerText;

if(!tarikh || mesyuarat === "-"){
alert("Sila pilih tarikh & mesyuarat dahulu");
return;
}

let res = await postAPI({
  action:"pdf",
  tarikh:tarikh,
  mesyuarat:mesyuarat
});

if(res && res.url){
window.open(res.url,"_blank");
}else{
alert("Gagal generate PDF");
}

}

</script>

</body>
</html>
