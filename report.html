<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDS Report System</title>

<style>
body{
  font-family:Arial;
  margin:0;
  padding:20px;
  background:linear-gradient(135deg,#064e3b,#022c22);
  color:white;
  text-align:center;
}

/* BOX */
.box{
  background:white;
  color:black;
  padding:15px;
  margin:10px;
  border-radius:12px;
}

/* INPUT */
input{
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

/* BUTTON */
button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#3498db;
  color:white;
  cursor:pointer;
  margin:5px;
}

button:disabled{
  background:#999;
}

/* INFO */
.info{
  background:white;
  color:black;
  padding:10px;
  border-radius:10px;
  margin:10px;
  font-weight:bold;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  background:white;
  color:black;
}

th,td{
  border:1px solid #000;
  padding:8px;
  text-align:left;
}

th{
  background:#f2f2f2;
}

/* POPUP */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:20px;
  width:320px;
  border-radius:10px;
  display:none;
  z-index:999;
  animation:fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn{
  from{opacity:0; transform:translate(-50%,-55%);}
  to{opacity:1; transform:translate(-50%,-50%);}
}

.popup button{
  width:100%;
  margin-top:8px;
}

/* LOADING OVERLAY */
#loading{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:1000;
}

.spinner{
  width:60px;
  height:60px;
  border:6px solid #ccc;
  border-top:6px solid #2ecc71;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

.loading-text{
  margin-top:12px;
  font-size:15px;
  font-weight:bold;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%,100%{opacity:1;}
  50%{opacity:0.4;}
}

/* PRINT */
@media print{
  button,.popup,#loading{
    display:none !important;
  }
  body{
    background:white;
    color:black;
  }
}
</style>
</head>

<body>

<h2>📄 MDS Report System</h2>

<!-- INPUT -->
<div class="box">
  <label>Tarikh:</label><br>
  <input type="date" id="tarikh"><br><br>

  <button onclick="loadMesyuarat()">🔍 Cari Report</button>
  <button onclick="downloadPDF()">📥 Print PDF</button>
</div>

<!-- INFO -->
<div class="info">
📌 Mesyuarat: <span id="mesyuarat">-</span><br>
📅 Tarikh: <span id="tarikhInfo">-</span>
</div>

<!-- TABLE -->
<div class="box">
<table>
<thead>
<tr>
<th>Bil</th>
<th>Nama</th>
<th>Jawatan</th>
<th>Bahagian</th>
<th>Tarikh</th>
<th>Masa</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
<h3>Pilih Mesyuarat</h3>
<div id="list"></div>
<button onclick="popup.style.display='none'">Tutup</button>
</div>

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Loading...</div>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzqPoD941zU_y7lrGsugd2WYOnXSPWBBtaz9z8DtYxv_F4IVtUSwA81Kx65vTFtA5gucA/exec";

const popup = document.getElementById("popup");
const tarikhEl = document.getElementById("tarikh");

/* =========================
   LOGIN CHECK
========================= */
if(sessionStorage.getItem("mds_login") !== "true"){
  alert("Sila login dahulu");
  window.location.href="login.html";
}

/* =========================
   LOADING CONTROL
========================= */
function showLoading(text){
  document.getElementById("loadingText").innerText = text || "Loading...";
  document.getElementById("loading").style.display = "flex";
}

function hideLoading(){
  document.getElementById("loading").style.display = "none";
}

/* =========================
   API CALL
========================= */
async function postAPI(payload){

  try{
    const res = await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"application/x-www-form-urlencoded"
      },
      body:new URLSearchParams(payload)
    });

    return await res.json();

  }catch(err){
    console.error(err);
    alert("Ralat sambungan API");
    return null;
  }
}

/* =========================
   LOAD MESYUARAT
========================= */
async function loadMesyuarat(){

if(!tarikhEl.value){
alert("Sila pilih tarikh");
return;
}

showLoading("Loading report data...");

document.getElementById("tarikhInfo").innerText = tarikhEl.value;

let data = await postAPI({
  action:"listMesyuarat",
  tarikh:tarikhEl.value
});

hideLoading();

let list=document.getElementById("list");
list.innerHTML="";

if(!Array.isArray(data) || data.length===0){
list.innerHTML="Tiada mesyuarat";
popup.style.display="block";
return;
}

data.forEach(m=>{
let btn=document.createElement("button");
btn.innerText=m;
btn.onclick=()=>loadReport(m);
list.appendChild(btn);
});

popup.style.display="block";
}

/* =========================
   LOAD REPORT
========================= */
async function loadReport(mesyuarat){

popup.style.display="none";

showLoading("Loading report data...");

document.getElementById("mesyuarat").innerText = mesyuarat;

let data = await postAPI({
  action:"report",
  tarikh:tarikhEl.value,
  mesyuarat:mesyuarat
});

hideLoading();

let tbody=document.getElementById("tbody");
tbody.innerHTML="";

if(!Array.isArray(data) || data.length===0){
tbody.innerHTML="<tr><td colspan='7'>Tiada data</td></tr>";
return;
}

data.forEach((r,i)=>{
tbody.innerHTML += `
<tr>
<td>${i+1}</td>
<td>${r.nama || "-"}</td>
<td>${r.jawatan || "-"}</td>
<td>${r.bahagian || "-"}</td>
<td>${r.tarikh || "-"}</td>
<td>${r.masa || "-"}</td>
<td>${r.status || "-"}</td>
</tr>
`;
});

}

/* =========================
   PRINT PDF
========================= */
async function downloadPDF(){

let tarikh = tarikhEl.value;
let mesyuarat = document.getElementById("mesyuarat").innerText;

if(!tarikh || mesyuarat === "-"){
alert("Sila pilih tarikh & mesyuarat dahulu");
return;
}

showLoading("Generating PDF report...");

let res = await postAPI({
  action:"pdf",
  tarikh:tarikh,
  mesyuarat:mesyuarat
});

hideLoading();

if(res && res.url){
window.open(res.url,"_blank");
}else{
alert("Gagal generate PDF");
}

}

</script>

</body>
</html>
