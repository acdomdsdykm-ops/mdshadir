<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard MDS</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#064e3b,#022c22);
  color:white;
  text-align:center;
}

.box{
  background:white;
  color:black;
  margin:20px;
  padding:20px;
  border-radius:12px;
}

input,select{
  width:90%;
  padding:10px;
  margin:8px;
}

button{
  padding:10px;
  width:95%;
  background:#16a34a;
  color:white;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<h2>🏢 Dashboard MDS</h2>

<div class="box">

<label>Tarikh</label><br>
<input type="date" id="tarikh"><br>

<label>Mesyuarat</label><br>
<input type="text" id="mesyuarat" placeholder="Nama mesyuarat"><br>

<button onclick="start()">🚀 Mula Scanner</button>

</div>

<script>

function start(){

if(!tarikh.value || !mesyuarat.value){
alert("Isi lengkap");
return;
}

sessionStorage.setItem("mds_data", JSON.stringify({
tarikh: tarikh.value,
mesyuarat: mesyuarat.value
}));

window.location.href="scanner.html";

}

</script>

</body>
</html>
