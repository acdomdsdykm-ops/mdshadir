<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Staf MDS Premium</title>

<style>

body{
  font-family:Arial;
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#064e3b,#022c22);
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:360px;
  background:rgba(255,255,255,0.10);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:22px;
  padding:20px;
  text-align:center;
  color:white;
  position:relative;
  overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,0.45);
}

.logo{width:75px;margin-bottom:5px;}

input{
  width:92%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin:10px 0;
  outline:none;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{transform:scale(1.02);}

.search-btn{background:#10b981;color:white;}
.reset-btn{background:#3b82f6;color:white;}

#error{
  color:#ff6b6b;
  font-size:13px;
  margin-top:5px;
  min-height:18px;
}

.profile{display:none;}

.id-card{
  margin-top:15px;
  padding:22px;
  border-radius:18px;
  background:linear-gradient(135deg,#0f9b8e,#22c55e);
  position:relative;
}

.name{
  font-size:19px;
  font-weight:900;
  background:rgba(255,255,255,0.2);
  padding:8px;
  border-radius:10px;
  margin-bottom:10px;
}

.info{font-size:14px;margin:5px 0;font-weight:700;}

#qrcode{
  margin-top:12px;
  background:white;
  padding:10px;
  border-radius:12px;
  display:inline-block;
}

.loading{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
  color:white;
}

.spinner{
  width:55px;
  height:55px;
  border:4px solid rgba(255,255,255,0.3);
  border-top:4px solid #10b981;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  100%{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <p>Sedang mencari data...</p>
</div>

<div class="card">

  <img src="mds.png" class="logo">

  <div><b>MAJLIS DAERAH SIMUNJAN</b></div>

  <div style="font-size:12px;margin-top:5px;">
    QR CODE STAF
  </div>

  <input id="icInput" placeholder="Masukkan 4 digit terakhir IC">

  <button class="search-btn" onclick="searchIC()">Semak Maklumat</button>

  <p id="error"></p>

  <div class="profile" id="profile">

    <div class="id-card">

      <div class="name" id="nama"></div>

      <div class="info" id="jawatan"></div>
      <div class="info" id="bahagian"></div>

      <div id="qrcode"></div>

    </div>

    <button class="reset-btn" onclick="location.reload()">🔄 Cari Semula</button>

  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbw6zVoZVBNcsuvt-VE0My1DC-xQKYeeQaaIClelN372dx8CxfWwqTS5pOS1U13jWem6Og/exec";

window.onload = () => document.getElementById("icInput").focus();

document.addEventListener("keydown", e=>{
  if(e.key==="Enter") searchIC();
});

function showLoading(){
  document.getElementById("loading").style.display="flex";
}

function hideLoading(){
  document.getElementById("loading").style.display="none";
}

async function searchIC(){

  let ic = document.getElementById("icInput").value.trim();
  let error = document.getElementById("error");

  error.innerText="";

  if(ic.length !== 4){
    error.innerText="Sila masukkan 4 digit IC";
    return;
  }

  showLoading();

  try {

    let res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "searchNama",
        ic: ic
      })
    });

    let data = await res.json();

    hideLoading();

    if(!data.success){
      error.innerText = data.message || "Tidak dijumpai";
      return;
    }

    document.getElementById("profile").style.display="block";

    document.getElementById("nama").innerText = data.nama;
    document.getElementById("jawatan").innerText = data.jawatan;
    document.getElementById("bahagian").innerText = data.bahagian;

    let qrURL = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(data.id)}&t=${Date.now()}`;

    document.getElementById("qrcode").innerHTML = `<img src="${qrURL}">`;

  } catch(err){

    hideLoading();
    error.innerText = "Ralat server / API tidak aktif";
    console.log(err);

  }
}

</script>

</body>
</html>
