<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kad Digital Staf MDS</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
  font-family:'Poppins',sans-serif;
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#064e3b,#022c22);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* WRAPPER */
.card{
  width:370px;
}

/* HEADER */
.card-header{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:22px;
  padding:22px;
  text-align:center;
  margin-bottom:15px;
  box-shadow:0 20px 50px rgba(0,0,0,0.35);
}

/* LOGO HEADER */
.logo{
  width:70px;
  margin-bottom:6px;
}

/* MAJLIS NAME */
.agency{
  font-size:14px;
  font-weight:900;
  color:#fff;
  letter-spacing:1px;
  text-shadow:0 2px 6px rgba(0,0,0,0.6);
}

.address{
  font-size:11px;
  opacity:0.8;
  color:#e5e7eb;
  line-height:1.4;
  margin-top:6px;
}

/* BUTTON */
.main-btn{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:700;
  background:#10b981;
  color:white;
  cursor:pointer;
}

/* ================= ID CARD ================= */
.id-card{
  margin-top:18px;
  padding:22px;
  border-radius:22px;
  background:linear-gradient(135deg,#0ea5a4,#22c55e);
  position:relative;
  overflow:hidden;

  /* EMBOSS FRAME */
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.35),
    inset 0 0 20px rgba(0,0,0,0.25),
    0 25px 60px rgba(0,0,0,0.5);
}

/* WATERMARK */
.id-card::before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  background:url('mds.png') no-repeat center;
  background-size:contain;
  opacity:0.05;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

/* 🔥 CLEAN LOGO (FIXED) */
.id-card-logo{
  width:65px;
  display:block;
  margin:0 auto 10px auto;

  filter:none; /* IMPORTANT: no dark effect */

  image-rendering: -webkit-optimize-contrast;

  box-shadow:0 4px 10px rgba(0,0,0,0);
}

/* TITLE */
.title-wrap{
  text-align:center;
  margin-bottom:12px;
}

/* MAJLIS NAME (WHITE) */
.org-name{
  font-size:12px;
  font-weight:700;
  color:#fff;
  text-shadow:0 2px 5px rgba(0,0,0,0.5);
}

/* BLUE LABEL */
.section-title{
  font-size:14px;
  font-weight:900;
  color:#0b2a4a;
  letter-spacing:1.5px;
  text-shadow:
    0 1px 0 rgba(255,255,255,0.6),
    0 -1px 0 rgba(0,0,0,0.3);
}

/* PROFILE CENTER */
.profile-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  margin-bottom:12px;
}

.staff-photo{
  width:100px;
  height:120px;
  object-fit:cover;
  border-radius:14px;
  border:2px solid rgba(255,255,255,0.4);
}

/* NAME */
.name-box{
  margin-top:10px;
  font-size:20px;
  font-weight:900;
  padding:10px 12px;
  border-radius:12px;
  background:rgba(255,255,255,0.25);
  color:#000;
}

/* BOTTOM SECTION */
.bottom-row{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

/* QR LEFT */
.qr-box{
  background:white;
  padding:8px;
  border-radius:12px;
  flex:0 0 110px;
  display:flex;
  justify-content:center;
}

.qr-box img{
  width:100px;
  height:100px;
}

/* INFO RIGHT */
.info{
  flex:1;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,0.2);
  color:#e5e7eb;
}

.row:last-child{
  border-bottom:none;
}

.label{
  font-size:10px;
  text-transform:uppercase;
}

.value{
  font-size:12px;
  font-weight:800;
  text-align:right;
}

/* NOTE */
.note{
  margin-top:12px;
  font-size:11px;
  text-align:center;
  color:#e5e7eb;
}

/* RESET */
.reset-btn{
  margin-top:14px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#3b82f6;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* LOADING */
.loading{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
}

.spinner{
  width:50px;
  height:50px;
  border:4px solid rgba(255,255,255,0.3);
  border-top:4px solid #10b981;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <p style="color:white;">Sedang mencari data...</p>
</div>

<div class="card">

  <!-- HEADER -->
  <div class="card-header">

    <img src="mds.png" class="logo">

    <div class="agency">MAJLIS DAERAH SIMUNJAN</div>

    <div class="address">
      Lot 805, Gunong Ngeli New Service Centre,<br>
      94800 Simunjan, Sarawak.
    </div>

    <button class="main-btn" onclick="searchIC()">🔍 Semakan ID Staf</button>

  </div>

  <!-- ID CARD -->
  <div class="id-card" id="idCard">

    <!-- CLEAN LOGO -->
    <img src="mds.png" class="id-card-logo">

    <div class="title-wrap">
      <div class="org-name">MAJLIS DAERAH SIMUNJAN</div>
      <div class="section-title">KAD DIGITAL STAF</div>
    </div>

    <div class="profile-center">
      <img id="staffPhoto" class="staff-photo">
      <div class="name-box" id="nama"></div>
    </div>

    <div class="bottom-row">

      <div class="qr-box" id="qrcode"></div>

      <div class="info">
        <div class="row"><div class="label">Jawatan</div><div class="value" id="jawatan"></div></div>
        <div class="row"><div class="label">Bahagian</div><div class="value" id="bahagian"></div></div>
        <div class="row"><div class="label">ID Staf</div><div class="value" id="idstaf"></div></div>
      </div>

    </div>

    <div class="note">
      Sila imbas QR untuk rekod kehadiran rasmi.
    </div>

    <button class="reset-btn" onclick="location.reload()">🔄 Semakan Semula</button>

  </div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxwwGQEH_bQY9fbkVIASu_WxGtyXrzrVqAQ77xHXm3iJpn_v8xHStHL_nRgSZXilQuPLQ/exec";

async function searchIC(){

  let ic = prompt("Masukkan 4 digit terakhir IC:");
  if(!ic) return;

  if(!/^\d{4}$/.test(ic)){
    alert("Sila masukkan 4 digit sahaja");
    return;
  }

  document.getElementById("loading").style.display="flex";

  try{

    let res = await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({action:"searchNama",ic})
    });

    let data = await res.json();

    if(!data.success){
      alert("Data tidak dijumpai");
      location.reload();
      return;
    }

    document.getElementById("idCard").style.display="block";

    document.getElementById("nama").innerText=data.nama;
    document.getElementById("jawatan").innerText=data.jawatan;
    document.getElementById("bahagian").innerText=data.bahagian;
    document.getElementById("idstaf").innerText=data.id;

    document.getElementById("staffPhoto").src =
      data.gambar || "https://via.placeholder.com/100x120";

    let qr=`https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(data.id)}&t=${Date.now()}`;
    document.getElementById("qrcode").innerHTML=`<img src="${qr}">`;

  }catch(e){
    alert("Ralat server / API tidak aktif");
  }finally{
    document.getElementById("loading").style.display="none";
  }
}

</script>

</body>
</html>
