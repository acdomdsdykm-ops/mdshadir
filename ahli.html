<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Staf MDS Premium</title>

<style>

body{
  font-family:Arial;
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#064e3b,#022c22);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= MAIN CARD ================= */
.card{
  width:360px;

  background:rgba(255,255,255,0.10);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  border:1px solid rgba(255,255,255,0.18);
  border-radius:22px;

  padding:20px;
  text-align:center;
  color:white;

  position:relative;
  overflow:hidden;

  box-shadow:0 30px 70px rgba(0,0,0,0.45);
}

/* OUTER WATERMARK */
.card::before{
  content:"";
  position:absolute;

  width:280px;
  height:280px;

  background:url('mds.png') no-repeat center;
  background-size:contain;

  opacity:0.06;
  filter:grayscale(100%);

  top:50%;
  left:50%;
  transform:translate(-50%,-50%);

  pointer-events:none; /* 🔥 FIX CLICK BLOCK */
}

/* GLOW */
.card::after{
  content:"";
  position:absolute;
  width:320px;
  height:320px;

  background:radial-gradient(circle,
    rgba(16,185,129,0.25),
    transparent 70%
  );

  top:-100px;
  left:-100px;
  border-radius:50%;

  pointer-events:none; /* 🔥 FIX CLICK BLOCK */
}

/* LOGO */
.logo{
  width:75px;
  margin-bottom:5px;
}

/* AGENCY */
.agency{
  font-size:15px;
  font-weight:800;
}

/* ADDRESS */
.address{
  font-size:11px;
  opacity:0.85;
  line-height:1.4;
}

/* LABEL */
.qr-label{
  margin-top:12px;
  display:inline-block;

  padding:10px 18px;
  font-size:14px;
  font-weight:900;

  color:#064e3b;

  background:linear-gradient(135deg,#ffffff,#eafff5);
  border:2px solid #10b981;
  border-radius:14px;
}

/* INPUT */
input{
  width:92%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin:10px 0;
  outline:none;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s ease;
}

button:hover{
  transform:scale(1.02);
}

.search-btn{
  background:#10b981;
  color:white;
}

.reset-btn{
  background:#3b82f6;
  color:white;
}

/* ERROR */
#error{
  color:#ff6b6b;
  font-weight:bold;
  font-size:13px;
  margin-top:5px;
}

/* PROFILE */
.profile{
  display:none;
}

/* ID CARD */
.id-card{
  margin-top:15px;
  padding:22px;
  border-radius:18px;

  background:linear-gradient(135deg,#0f9b8e,#22c55e);
  box-shadow:0 25px 50px rgba(0,0,0,0.4);

  position:relative;
  overflow:hidden;

  isolation:isolate;
}

/* INNER WATERMARK */
.id-card::after{
  content:"";
  position:absolute;

  width:380px;
  height:380px;

  background:url('mds.png') no-repeat center;
  background-size:contain;

  opacity:0.06;
  filter:grayscale(100%);

  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(1.15);

  pointer-events:none; /* 🔥 FIX CLICK BLOCK */

  z-index:0;
}

.id-card > *{
  position:relative;
  z-index:2;
}

/* NAME */
.name{
  font-size:19px;
  font-weight:900;
  background:rgba(255,255,255,0.2);
  padding:8px;
  border-radius:10px;
  margin-bottom:10px;
}

/* INFO */
.info{
  font-size:14px;
  margin:5px 0;
}

.bold{
  font-weight:900;
}

/* QR */
#qrcode{
  margin-top:12px;
  background:white;
  padding:10px;
  border-radius:12px;
  display:inline-block;
}

/* NOTE */
.note{
  font-size:13px;
  font-weight:900;
  margin-top:12px;
  line-height:1.4;
}

/* LOADING */
.loading{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
  color:white;
}

.spinner{
  width:55px;
  height:55px;
  border:4px solid rgba(255,255,255,0.3);
  border-top:4px solid #10b981;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <p>Sedang mencari data...</p>
</div>

<div class="card">

  <img src="mds.png" class="logo">

  <div class="agency">MAJLIS DAERAH SIMUNJAN</div>

  <div class="address">
    Lot 805, Gunong Ngeli New Service Centre,<br>
    94800 Simunjan, Sarawak
  </div>

  <div class="qr-label">📱 QR CODE STAF</div>

  <!-- SEARCH -->
  <div id="searchBox">

    <input id="icInput" placeholder="Masukkan 4 digit terakhir IC">

    <button class="search-btn" onclick="searchIC()">Semak Maklumat</button>

  </div>

  <p id="error"></p>

  <!-- PROFILE -->
  <div class="profile" id="profile">

    <div class="id-card">

      <div class="name" id="nama"></div>

      <div class="info bold" id="jawatan"></div>
      <div class="info bold" id="bahagian"></div>

      <div id="qrcode"></div>

      <div class="note">
        Sila tunjukkan QRCode ini kepada Urusetia untuk tujuan rekod kehadiran.<br>
        Terima kasih.
      </div>

    </div>

    <button class="reset-btn" onclick="location.reload()">🔄 Cari Semula</button>

  </div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxi6lk4tgJeEP_TVKcgPQraY1sasPpVUml4Oa-LfcVEohLPKNZN-c10sTIJiqTnvkkYeA/exec";

/* AUTO FOCUS */
window.onload = () => {
  document.getElementById("icInput").focus();
};

function showLoading(){
  document.getElementById("loading").style.display="flex";
}

function hideLoading(){
  document.getElementById("loading").style.display="none";
}

/* ENTER KEY SUPPORT */
document.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    searchIC();
  }
});

function searchIC(){

  let ic=document.getElementById("icInput").value.trim();
  let error=document.getElementById("error");

  if(ic.length!==4){
    error.innerText="Sila masukkan 4 digit IC";
    return;
  }

  showLoading();

  fetch(API+"?action=searchNama&ic="+ic)
  .then(r=>r.json())
  .then(res=>{

    hideLoading();

    if(!res.success){
      error.innerText=res.message||"Maklumat tidak sah";
      return;
    }

    document.getElementById("searchBox").style.display="none";
    document.getElementById("profile").style.display="block";

    document.getElementById("nama").innerText=res.nama;
    document.getElementById("jawatan").innerText=res.jawatan;
    document.getElementById("bahagian").innerText=res.bahagian;

    let qr="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data="+encodeURIComponent(res.id);

    document.getElementById("qrcode").innerHTML=`<img src="${qr}">`;

  })
  .catch(()=>{
    hideLoading();
    error.innerText="Ralat server";
  });

}

</script>

</body>
</html>
