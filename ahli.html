<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kad Digital Staf MDS Ultra</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
  font-family:'Poppins',sans-serif;
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#064e3b,#022c22);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* WRAPPER */
.card{ width:370px; }

/* ================= HEADER ================= */
.card-header{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:22px;
  padding:22px;
  text-align:center;
  margin-bottom:15px;
  box-shadow:0 20px 50px rgba(0,0,0,0.35);
}

/* HEADER LOGO (NO CIRCLE) */
.logo{
  width:65px;
  height:auto;
  margin-bottom:6px;
  filter:brightness(0) invert(0);
}

.agency{
  font-size:14px;
  font-weight:900;
  color:#fff;
}

.address{
  font-size:11px;
  color:#e5e7eb;
  opacity:0.85;
  line-height:1.4;
  margin-top:6px;
}

.main-btn{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:700;
  background:#10b981;
  color:white;
  cursor:pointer;
}

/* ================= CARD ================= */
.id-card{
  margin-top:18px;
  padding:22px;
  border-radius:22px;
  background:linear-gradient(135deg,#0ea5a4,#22c55e);
  position:relative;
  overflow:hidden;

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.35),
    inset 0 0 25px rgba(0,0,0,0.25),
    0 25px 60px rgba(0,0,0,0.5);
}

/* WATERMARK LOGO */
.id-card::before{
  content:"";
  position:absolute;
  width:320px;
  height:320px;
  background:url('mds.png') no-repeat center;
  background-size:contain;
  opacity:0.07;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

/* HOLOGRAM EFFECT */
.id-card::after{
  content:"";
  position:absolute;
  top:-90%;
  left:-50%;
  width:90%;
  height:280%;
  background:linear-gradient(
    120deg,
    transparent 0%,
    rgba(255,0,255,0.12) 18%,
    rgba(0,255,255,0.18) 40%,
    rgba(255,255,0,0.16) 60%,
    rgba(0,255,150,0.18) 80%,
    transparent 100%
  );
  transform:rotate(25deg);
  animation:holo 4s linear infinite;
  pointer-events:none;
}

@keyframes holo{
  0%{transform:translateX(-150%) rotate(25deg);}
  100%{transform:translateX(260%) rotate(25deg);}
}

/* LOGO INSIDE CARD (NO CIRCLE) */
.id-card-logo{
  width:52px;
  display:block;
  margin:0 auto 10px auto;
  filter:brightness(0) invert(0);
}

/* TITLE */
.title-wrap{
  text-align:center;
  margin-bottom:12px;
}

.org-name{
  font-size:12px;
  font-weight:700;
  color:#fff;
}

.section-title{
  font-size:14px;
  font-weight:900;
  color:#0b2a4a;
}

/* PROFILE */
.profile-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:12px;
}

/* 🔥 FIX: GAMBAR STAF SOLID */
.staff-photo{
  width:100px;
  height:120px;
  object-fit:cover;
  border-radius:14px;
  border:2px solid rgba(255,255,255,0.4);

  opacity:0 !important;
  filter:none !important;
  background:#fff;
}

.name-box{
  margin-top:10px;
  font-size:20px;
  font-weight:900;
  padding:10px 12px;
  border-radius:12px;
  background:rgba(255,255,255,0.35);
  color:#000;
}

/* INFO SECTION */
.bottom-row{
  display:flex;
  gap:12px;
}

.qr-box{
  background:#fff;
  padding:8px;
  border-radius:12px;
  flex:0 0 110px;
  display:flex;
  justify-content:center;
}

.qr-box img{
  width:100px;
  height:100px;
}

.info{
  flex:1;
}

.row{
  display:grid;
  grid-template-columns:90px 1fr;
  padding:6px 0;
  border-bottom:1px solid rgba(0,0,0,0.15);
}

.row:last-child{ border-bottom:none; }

.label{
  font-size:10px;
  color:#000;
  opacity:0.75;
  text-transform:uppercase;
}

.value{
  font-size:12px;
  font-weight:800;
  color:#000;
}

/* NOTE */
.note{
  margin-top:12px;
  font-size:11px;
  text-align:center;
  color:#000;
}

/* LOADING */
.loading{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
}

.spinner{
  width:50px;
  height:50px;
  border:4px solid rgba(255,255,255,0.3);
  border-top:4px solid #10b981;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <p style="color:white;">Sedang mencari data...</p>
</div>

<div class="card">

  <!-- HEADER -->
  <div class="card-header">

    <img src="mds.png" class="logo">

    <div class="agency">MAJLIS DAERAH SIMUNJAN</div>

    <div class="address">
      Lot 805, Gunong Ngeli New Service Centre,<br>
      94800 Simunjan, Sarawak.
    </div>

    <button class="main-btn" onclick="searchIC()">🔍 Semakan ID Staf</button>

  </div>

  <!-- ID CARD -->
  <div class="id-card" id="idCard">

    <img src="mds.png" class="id-card-logo">

    <div class="title-wrap">
      <div class="org-name">MAJLIS DAERAH SIMUNJAN</div>
      <div class="section-title">KAD DIGITAL STAF</div>
    </div>

    <div class="profile-center">
      <img id="staffPhoto" class="staff-photo">
      <div class="name-box" id="nama"></div>
    </div>

    <div class="bottom-row">

      <div class="qr-box" id="qrcode"></div>

      <div class="info">
        <div class="row"><div class="label">Jawatan</div><div class="value" id="jawatan"></div></div>
        <div class="row"><div class="label">Bahagian</div><div class="value" id="bahagian"></div></div>
        <div class="row"><div class="label">ID Staf</div><div class="value" id="idstaf"></div></div>
      </div>

    </div>

    <div class="note">Sila imbas QR untuk rekod kehadiran rasmi.</div>

  </div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxwwGQEH_bQY9fbkVIASu_WxGtyXrzrVqAQ77xHXm3iJpn_v8xHStHL_nRgSZXilQuPLQ/exec";

async function searchIC(){

  let ic = prompt("Masukkan 4 digit terakhir IC:");
  if(!ic) return;

  document.getElementById("loading").style.display="flex";

  try{

    let res = await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({action:"searchNama",ic})
    });

    let data = await res.json();

    if(!data.success){
      alert("Data tidak dijumpai");
      return;
    }

    document.getElementById("idCard").style.display="block";

    document.getElementById("nama").innerText=data.nama;
    document.getElementById("jawatan").innerText=data.jawatan;
    document.getElementById("bahagian").innerText=data.bahagian;
    document.getElementById("idstaf").innerText=data.id;

    document.getElementById("staffPhoto").src =
      data.gambar || "https://via.placeholder.com/100x120";

    let qr=`https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(data.id)}`;
    document.getElementById("qrcode").innerHTML=`<img src="${qr}">`;

  }catch(e){
    alert("Ralat server");
  }finally{
    document.getElementById("loading").style.display="none";
  }
}

</script>

</body>
</html>
