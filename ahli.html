<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Staf MDS Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
  font-family:'Poppins',sans-serif;
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#064e3b,#022c22);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

/* CARD */
.card{
  width:370px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:22px;
  padding:22px;
  text-align:center;
  box-shadow:0 30px 70px rgba(0,0,0,0.45);
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  width:340px;
  height:340px;
  background:url('mds.png') no-repeat center;
  background-size:contain;
  opacity:0.06;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

/* HEADER */
.logo{ width:70px; margin-bottom:6px; }

.agency{
  font-size:16px;
  font-weight:800;
}

.address{
  font-size:11px;
  opacity:0.8;
  margin-top:3px;
  line-height:1.4;
}

/* BUTTON */
.main-btn{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  background:#10b981;
  color:white;
}

.main-btn:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

/* ID CARD */
.id-card{
  margin-top:18px;
  padding:22px;
  border-radius:20px;
  background:linear-gradient(135deg,#0ea5a4,#22c55e);
  box-shadow:0 25px 60px rgba(0,0,0,0.35);
  display:none;
  position:relative;
  text-align:left;
}

.id-card::before{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  background:url('mds.png') no-repeat center;
  background-size:contain;
  opacity:0.05;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

/* TITLE */
.section-title{
  font-size:14px;
  font-weight:800;
  letter-spacing:1.8px;
  text-transform:uppercase;
  text-align:center;
  margin-bottom:10px;
}

.section-title::after{
  content:"";
  display:block;
  width:50px;
  height:2px;
  background:rgba(255,255,255,0.7);
  margin:6px auto 0;
}

/* NAME */
.name-box{
  font-size:20px;
  font-weight:800;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,0.18);
  text-align:center;
  margin-bottom:14px;
}

/* ROW */
.row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,0.25);
}

.row:last-child{ border-bottom:none; }

.label{
  font-size:11px;
  opacity:0.85;
  text-transform:uppercase;
}

.value{
  font-size:13px;
  font-weight:800;
}

/* QR */
.qr-box{
  margin-top:14px;
  background:white;
  padding:10px;
  border-radius:14px;
  display:flex;
  justify-content:center;
}

.qr-box img{
  width:160px;
  height:160px;
}

/* NOTE */
.note{
  margin-top:12px;
  font-size:11px;
  text-align:center;
}

/* RESET */
.reset-btn{
  display:none;
  margin-top:14px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#3b82f6;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* LOADING */
.loading{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
}

.spinner{
  width:50px;
  height:50px;
  border:4px solid rgba(255,255,255,0.3);
  border-top:4px solid #10b981;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <p>Sedang mencari data...</p>
</div>

<div class="card">

  <img src="mds.png" class="logo">

  <div class="agency">MAJLIS DAERAH SIMUNJAN</div>
  <div class="address">
    Lot 805, Gunong Ngeli New Service Centre,<br>
    94800 Simunjan, Sarawak
  </div>

  <button class="main-btn" id="searchBtn" onclick="searchIC()">🔍 Cari Maklumat Staf</button>

  <div class="id-card" id="idCard">

    <div class="section-title">Kad Staf Digital</div>

    <div class="name-box" id="nama"></div>

    <div class="row">
      <div class="label">Jawatan</div>
      <div class="value" id="jawatan"></div>
    </div>

    <div class="row">
      <div class="label">Bahagian</div>
      <div class="value" id="bahagian"></div>
    </div>

    <div class="row">
      <div class="label">ID Staf</div>
      <div class="value" id="idstaf"></div>
    </div>

    <div class="qr-box" id="qrcode"></div>

    <div class="note">
      Sila imbas QR untuk rekod kehadiran rasmi.
      Terima kasih.
    </div>

  </div>

  <button class="reset-btn" id="resetBtn" onclick="location.reload()">🔄 Semakan Semula</button>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbwkMrH2Yf3jOJ2h-G5KzTxWLuEDfWpw31MsFVq8W73W9yQA5UP5kb7S6tQQrS7v3PJfkg/exec";

async function searchIC(){

  let ic = prompt("Masukkan 4 digit terakhir IC:");
  if(!ic) return;

  if(!/^\d{4}$/.test(ic)){
    alert("Sila masukkan 4 digit sahaja");
    return;
  }

  let btn = document.getElementById("searchBtn");
  btn.disabled = true;
  document.getElementById("loading").style.display="flex";

  try{

    let res = await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({action:"searchNama",ic})
    });

    let data = await res.json();

    if(!data.success){
      alert("Data tidak dijumpai");
      location.reload();
      return;
    }

    document.getElementById("idCard").style.display="block";
    document.getElementById("resetBtn").style.display="block";

    document.getElementById("nama").innerText=data.nama;
    document.getElementById("jawatan").innerText=data.jawatan;
    document.getElementById("bahagian").innerText=data.bahagian;
    document.getElementById("idstaf").innerText=data.id;

    let qr=`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(data.id)}&t=${Date.now()}`;
    document.getElementById("qrcode").innerHTML=`<img src="${qr}">`;

  }catch(e){
    alert("Ralat server / API tidak aktif");
    location.reload();
  }finally{
    document.getElementById("loading").style.display="none";
    btn.disabled = false;
  }
}

</script>

</body>
</html>
