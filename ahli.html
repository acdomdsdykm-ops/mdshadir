<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kad Digital Staf MDS</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
  font-family:'Poppins',sans-serif;
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#064e3b,#022c22);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  box-sizing:border-box;
}

/* WRAPPER */
.card{
  width:370px;
  max-width:100%;
}

/* HEADER */
.card-header{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:22px;
  padding:22px;
  text-align:center;
  margin-bottom:15px;
  box-shadow:0 20px 50px rgba(0,0,0,0.35);
}

/* LOGO HEADER */
.logo{
  width:70px;
  margin-bottom:6px;
}

/* MAJLIS NAME */
.agency{
  font-size:14px;
  font-weight:900;
  color:#fff;
  letter-spacing:1px;
  text-shadow:0 2px 6px rgba(0,0,0,0.6);
}

.address{
  font-size:11px;
  opacity:0.8;
  color:#e5e7eb;
  line-height:1.4;
  margin-top:6px;
}

/* BUTTON */
.main-btn{
  margin-top:15px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:700;
  background:#10b981;
  color:white;
  cursor:pointer;
}

/* ================= ID CARD ================= */
.id-card{
  display:none;
  margin-top:18px;
  padding:22px;
  border-radius:22px;
  background:linear-gradient(135deg,#0ea5a4,#22c55e);
  position:relative;
  overflow:hidden;
  box-shadow:0 25px 60px rgba(0,0,0,0.5);
}

/* WATERMARK */
.id-card::before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  background:url('mds.png') no-repeat center;
  background-size:contain;
  opacity:0.05;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

/* LOGO ID CARD */
.id-card-logo{
  width:65px;
  display:block;
  margin:0 auto 5px auto;
}

/* 🔥 TAMBAHAN: NAMA MAJLIS DALAM ID CARD */
.id-card-agency{
  text-align:center;
  font-size:11px;
  font-weight:800;
  color:#ffffff;
  letter-spacing:1px;
  margin-bottom:2px;
  text-shadow:0 2px 5px rgba(0,0,0,0.5);
}

/* TITLE */
.title-wrap{
  text-align:center;
  margin-bottom:12px;
}

.org-name{
  font-size:12px;
  font-weight:700;
  color:#fff;
}

.section-title{
  font-size:14px;
  font-weight:900;
  color:#0b2a4a;
}

/* PROFILE */
.profile-center{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  margin-bottom:12px;
}

.staff-photo{
  width:100px;
  height:120px;
  object-fit:cover;
  border-radius:14px;
  border:2px solid rgba(255,255,255,0.4);
}

.name-box{
  margin-top:10px;
  font-size:20px;
  font-weight:900;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,0.25);
}

/* BOTTOM */
.bottom-row{
  display:flex;
  gap:12px;
}

.qr-box{
  background:white;
  padding:8px;
  border-radius:12px;
  flex:0 0 110px;
}

.qr-box img{width:100px;}

.info{flex:1;}

.row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

.label{font-size:10px;color:#e5e7eb;}
.value{font-size:12px;font-weight:800;color:white;}

/* RESET */
.reset-btn{
  margin-top:14px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#3b82f6;
  color:white;
  font-weight:700;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.popup-box{
  width:90%;
  max-width:420px;
  background:white;
  border-radius:20px;
  padding:20px;
}

.popup-title{
  text-align:center;
  font-weight:900;
  margin-bottom:10px;
}

.popup-btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#f3f4f6;
  text-align:left;
  cursor:pointer;
}

.popup-btn:hover{background:#d1fae5;}

/* LOADING */
.loading{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.spinner{
  width:50px;
  height:50px;
  border:4px solid #ccc;
  border-top:4px solid #10b981;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

</style>
</head>

<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
</div>

<div class="popup" id="popup">
  <div class="popup-box">
    <div class="popup-title">Pilih Nama Staf</div>
    <div id="popupList"></div>
  </div>
</div>

<div class="card">

  <div class="card-header">

    <img src="mds.png" class="logo">

    <div class="agency">MAJLIS DAERAH SIMUNJAN</div>

    <div class="address">
      Lot 805, Gunong Ngeli New Service Centre,<br>
      94800 Simunjan, Sarawak.
    </div>

    <button class="main-btn" onclick="searchIC()">
      🔍 Semakan ID Staf
    </button>

  </div>

  <!-- ID CARD -->
  <div class="id-card" id="idCard">

    <img src="mds.png" class="id-card-logo">

    <!-- 🔥 TAMBAHAN NAMA MAJLIS DALAM ID CARD -->
    <div class="id-card-agency">
      MAJLIS DAERAH SIMUNJAN
    </div>

    <div class="title-wrap">

      <div class="section-title">KAD DIGITAL STAF</div>

    </div>

    <div class="profile-center">

      <img id="staffPhoto" class="staff-photo">

      <div class="name-box" id="nama"></div>

    </div>

    <div class="bottom-row">

      <div class="qr-box" id="qrcode"></div>

      <div class="info">
        <div class="row"><div class="label">Jawatan</div><div class="value" id="jawatan"></div></div>
        <div class="row"><div class="label">Bahagian</div><div class="value" id="bahagian"></div></div>
        <div class="row"><div class="label">ID Staf</div><div class="value" id="idstaf"></div></div>
      </div>

    </div>

    <button class="reset-btn" onclick="location.reload()">🔄 Semakan Semula</button>

  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzjl73uU9lHmVDb03jJT4tFMFSCvIkxSkfbFJpPl_DiTjdpahexTT9ITwHBpNBYBAejqQ/exec";

let staffList = [];

/* SEARCH */
async function searchIC(){

  let ic = prompt("Masukkan 4 digit terakhir IC:");
  if(!ic) return;

  document.getElementById("loading").style.display="flex";

  try{

    let res = await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({action:"searchNama",ic})
    });

    let data = await res.json();

    if(!data || (data.success === false && !Array.isArray(data))){
      alert("Data tidak dijumpai");
      return;
    }

    if(Array.isArray(data)){
      staffList = data;
      showPopup(data);
      return;
    }

    showCard(data);

  }finally{
    document.getElementById("loading").style.display="none";
  }

}

/* POPUP */
function showPopup(list){

  let box = document.getElementById("popupList");
  box.innerHTML = "";

  list.forEach((item,index)=>{

    box.innerHTML += `
      <button class="popup-btn" onclick="selectStaff(${index})">
        <b>${item.nama}</b><br>
        <small>${item.jawatan}</small>
      </button>
    `;

  });

  document.getElementById("popup").style.display="flex";

}

function selectStaff(i){
  document.getElementById("popup").style.display="none";
  showCard(staffList[i]);
}

/* CARD */
function showCard(data){

  document.getElementById("idCard").style.display="block";

  document.getElementById("nama").innerText=data.nama;
  document.getElementById("jawatan").innerText=data.jawatan;
  document.getElementById("bahagian").innerText=data.bahagian;
  document.getElementById("idstaf").innerText=data.id;

  document.getElementById("staffPhoto").src=data.gambar;

  document.getElementById("qrcode").innerHTML=
    `<img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${data.id}">`;

}

</script>

</body>
</html>
