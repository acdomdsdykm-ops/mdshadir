<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Kehadiran MDS</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial;
  background:#022c22;
  color:white;
  text-align:center;
  margin:0;
}

h2{margin:10px 0;}

#reader{
  width:320px;
  margin:10px auto;
}

#statusBox{
  width:300px;
  margin:10px auto;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}

.ready{background:#16a34a;}
.processing{background:#f59e0b;}
.success{background:#2563eb;}
.error{background:#dc2626;}

/* TABLE */
.table-box{
  margin:15px;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  color:black;
  font-size:13px;
}

th,td{
  border:1px solid #ddd;
  padding:6px;
}

th{
  background:#16a34a;
  color:white;
}

/* STATUS */
.status-Hadir{color:green;font-weight:bold;}
.status-Duplicate{color:red;font-weight:bold;}

/* POPUP */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:20px;
  border-radius:12px;
  opacity:0;
  visibility:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}
.popup.show{
  opacity:1;
  visibility:visible;
}

button{
  background:red;
  color:white;
  padding:10px;
  border:none;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>

<body>

<h2>📷 Scanner Kehadiran MDS</h2>

<div id="statusBox" class="ready">🟢 Sedia scan</div>

<div id="reader"></div>

<button onclick="back()">⬅️ Kembali</button>

<div class="table-box">
<table>
<thead>
<tr>
<th>Nama</th>
<th>Jawatan</th>
<th>Masa</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div id="popup" class="popup">
<h3>✔ BERJAYA</h3>
<p id="pNama"></p>
<p id="pJawatan"></p>
</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbyLDt7eLt3-3KXd15xgoVVOEHM6wwY-q3eRsTjYs7gU57TQgOwOaFOkMY-wxxkvFbpUOw/exec";

let scanner;
let lock=false;
let sessionKey="";
const beep=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

/* DATA SESSION */
let data=JSON.parse(sessionStorage.getItem("mds_data")||"{}");

if(!data.mesyuarat){
alert("Sila isi maklumat di dashboard");
window.location.href="dashboard.html";
}

/* STATUS */
function setStatus(type,text){
statusBox.className=type;
statusBox.innerText=text;
}

/* SESSION RESET */
function getSessionKey(){
return data.mesyuarat+"_"+data.tarikh+"_"+data.masa;
}

function checkSession(){
let newKey=getSessionKey();
if(sessionKey !== newKey){
sessionKey = newKey;
tbody.innerHTML="";
console.log("🔄 Session reset");
}
}

/* TIME */
function nowTime(){
return new Date().toLocaleTimeString();
}

/* ADD ROW */
function addRow(res){

let tr=document.createElement("tr");

tr.innerHTML=`
<td>${res.nama || "-"}</td>
<td>${res.jawatan || "-"}</td>
<td>${nowTime()}</td>
<td class="status-${res.status || "Hadir"}">${res.status || "Hadir"}</td>
`;

tbody.prepend(tr);
}

/* START SCAN */
function startQR(){

scanner=new Html5Qrcode("reader");

scanner.start(
{facingMode:"environment"},
{fps:10,qrbox:250},
text=>{

/* VALIDATION */
if(lock) return;
lock=true;

if(!text || text.length < 3){
setStatus("error","❌ QR tidak sah");
lock=false;
return;
}

setStatus("processing","🟡 Memproses...");

scanner.stop().catch(()=>{});

fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"text/plain"},
body:JSON.stringify({
id:text,
mesyuarat:data.mesyuarat,
tarikh:data.tarikh,
masa:data.masa
})
})
.then(async r=>{
let res=await r.json();
return res;
})
.then(res=>{

checkSession();

beep.play();

pNama.innerHTML="<b>"+res.nama+"</b>";
pJawatan.innerHTML="<b>"+res.jawatan+"</b>";

popup.classList.add("show");

addRow(res);

setStatus("success","🔵 Berjaya");

setTimeout(()=>{
popup.classList.remove("show");
lock=false;
setStatus("ready","🟢 Sedia scan");
startQR();
},1200);

})
.catch(err=>{
console.log("API ERROR:",err);
setStatus("error","❌ Error API");
lock=false;
startQR();
});

});

}

function back(){
window.location.href="dashboard.html";
}

startQR();

</script>

</body>
</html>
