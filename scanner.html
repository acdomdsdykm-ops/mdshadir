<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Kehadiran MDS</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial;
  background:#022c22;
  color:white;
  text-align:center;
  margin:0;
}

/* HEADER */
h2{
  margin-top:10px;
}

/* INFO */
.info{
  background:white;
  color:black;
  margin:10px auto;
  padding:12px;
  width:340px;
  border-radius:12px;
  font-size:13px;
  text-align:left;
}

/* SCANNER */
#reader{
  width:320px;
  margin:10px auto;
}

/* STATUS */
#statusBox{
  width:300px;
  margin:10px auto;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}

.ready{background:#16a34a;}
.processing{background:#f59e0b;}
.success{background:#2563eb;}
.error{background:#dc2626;}

/* TABLE */
.table-box{
  margin:15px;
  overflow-x:auto;
}

table{
  width:100%;
  background:white;
  color:black;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  font-size:13px;
}

th{
  background:#16a34a;
  color:white;
}

/* POPUP */
.popup{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:20px;
  border-radius:12px;
  opacity:0;
  visibility:hidden;
  transition:0.2s;
}

.popup.show{
  opacity:1;
  visibility:visible;
}

/* BUTTON */
button{
  background:red;
  color:white;
  padding:10px;
  border:none;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>📷 Scanner Kehadiran MDS</h2>

<div class="info">
📌 Sistem Kehadiran Digital MDS<br>
✔ Scan QR untuk rekod kehadiran
</div>

<div id="statusBox" class="ready">🟢 Sedia scan</div>

<div id="reader"></div>

<button onclick="back()">⬅️ Kembali</button>

<div class="table-box">
<table>
<thead>
<tr>
<th>Nama</th>
<th>Jawatan</th>
<th>Bahagian</th>
<th>Masa</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div id="popup" class="popup">
<h3 style="color:green;">✔ Berjaya</h3>
<p id="pNama"></p>
<p id="pJawatan"></p>
</div>

<script>

/* =========================
   API URL (PASTE WEB APP)
========================= */
const API = "https://script.google.com/macros/s/AKfycbyFX_b2V2UIU82i97nYoPnqKrL-Dq-nOl0hjXJYra_PX3KFN2ogOaQPweMtJIKahorujA/exec";

/* =========================
   ELEMENT
========================= */
let scanner;
let lock = false;

const statusBox = document.getElementById("statusBox");
const tbody = document.getElementById("tbody");
const popup = document.getElementById("popup");
const pNama = document.getElementById("pNama");
const pJawatan = document.getElementById("pJawatan");

const beep = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

/* =========================
   STATUS UI
========================= */
function setStatus(type,msg){
  statusBox.className = type;
  statusBox.innerText = msg;
}

/* =========================
   TABLE ROW
========================= */
function addRow(res){

  let tr = document.createElement("tr");

  tr.innerHTML = `
    <td><b>${res.nama}</b></td>
    <td>${res.jawatan}</td>
    <td>${res.bahagian || "-"}</td>
    <td>${res.masa}</td>
    <td>Hadir</td>
  `;

  tbody.prepend(tr);
}

/* =========================
   START SCANNER
========================= */
function startQR(){

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },

    async (text) => {

      if(lock) return;
      lock = true;

      setStatus("processing","🟡 Memproses...");

      scanner.stop().catch(()=>{});

      try{

        const res = await fetch(API,{
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body: JSON.stringify({
            action: "scan",
            nama: text,
            jawatan: "-",
            bahagian: "-",
            tarikh: "",
            mesyuarat: ""
          })
        });

        const data = await res.json();

        if(data.status === "error"){
          setStatus("error","❌ "+data.message);
          lock=false;
          setTimeout(startQR,800);
          return;
        }

        beep.play();

        pNama.innerText = data.nama;
        pJawatan.innerText = data.jawatan;

        popup.classList.add("show");

        addRow(data);

        setStatus("success","✔ Berjaya");

        setTimeout(()=>{
          popup.classList.remove("show");
          lock=false;
          setStatus("ready","🟢 Sedia scan");
          setTimeout(startQR,500);
        },1200);

      }catch(err){
        console.log(err);
        setStatus("error","❌ Server error");
        lock=false;
        setTimeout(startQR,1000);
      }

    }

  );

}

/* =========================
   BACK BUTTON
========================= */
function back(){
  window.location.href="dashboard.html";
}

/* =========================
   INIT
========================= */
startQR();

</script>

</body>
</html>
