<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner MDS</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial;
  background:#022c22;
  color:white;
  text-align:center;
  margin:0;
}

#reader{
  width:320px;
  margin:10px auto;
}

#statusBox{
  width:300px;
  margin:10px auto;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}

.ready{background:#16a34a;}
.processing{background:#f59e0b;}
.success{background:#2563eb;}
.error{background:#dc2626;}

table{
  width:100%;
  background:white;
  color:black;
  border-collapse:collapse;
  font-size:13px;
}

th,td{
  border:1px solid #ddd;
  padding:6px;
}

th{background:#16a34a;color:white;}

.popup{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:20px;
  border-radius:12px;
  opacity:0;
  visibility:hidden;
}

.popup.show{
  opacity:1;
  visibility:visible;
}

button{
  margin-top:10px;
  padding:10px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<h2>📷 Scanner Kehadiran MDS</h2>

<div id="statusBox" class="ready">🟢 Sedia scan</div>

<div id="reader"></div>

<button onclick="back()">⬅️ Kembali</button>

<table>
<thead>
<tr>
<th>Bil</th>
<th>Nama</th>
<th>Jawatan</th>
<th>Bahagian</th>
<th>Masa</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div id="popup" class="popup">
<h3>✔ BERJAYA</h3>
<p id="pNama"></p>
<p id="pJawatan"></p>
</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbz6FrSlcR8ee6QXHHEQbx6dHQW7pf29Dh3T4drbOXitCWRKMaTNudv5yb446pawkMVunA/exec";

let scanner;
let lock=false;
let bil=0;

const beep=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

let data=JSON.parse(sessionStorage.getItem("mds_data")||"{}");

if(!data.mesyuarat){
alert("Sila isi dashboard");
window.location.href="dashboard.html";
}

function setStatus(type,text){
statusBox.className=type;
statusBox.innerText=text;
}

function addRow(res){

bil++;

let tr=document.createElement("tr");

tr.innerHTML=`
<td>${bil}</td>
<td>${res.nama || "-"}</td>
<td>${res.jawatan || "-"}</td>
<td>${res.bahagian || "-"}</td>
<td>${res.masa || "-"}</td>
<td>${res.status || "Hadir"}</td>
`;

tbody.prepend(tr);
}

function startQR(){

scanner=new Html5Qrcode("reader");

scanner.start(
{facingMode:"environment"},
{fps:10,qrbox:250},
text=>{

if(lock) return;
lock=true;

if(!text){
setStatus("error","❌ QR kosong");
lock=false;
return;
}

setStatus("processing","🟡 Proses...");

scanner.stop().catch(()=>{});

fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"text/plain"},
body:JSON.stringify({
id:text,
tarikh:data.tarikh,
mesyuarat:data.mesyuarat
})
})
.then(r=>r.json())
.then(res=>{

beep.play();

pNama.innerHTML="<b>"+res.nama+"</b>";
pJawatan.innerHTML="<b>"+res.jawatan+"</b>";

popup.classList.add("show");

addRow(res);

setStatus("success","🔵 Berjaya");

setTimeout(()=>{
popup.classList.remove("show");
lock=false;
setStatus("ready","🟢 Sedia scan");
startQR();
},1000);

})
.catch(err=>{
console.log(err);
setStatus("error","❌ API Error");
lock=false;
startQR();
});

});

}

function back(){
window.location.href="dashboard.html";
}

startQR();

</script>

</body>
</html>
