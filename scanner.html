<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Kehadiran</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial;
  margin:0;
  text-align:center;
  background:linear-gradient(135deg,#022c22,#064e3b);
  color:white;
}

#reader{
  width:320px;
  margin:20px auto;
}

table{
  width:100%;
  background:white;
  color:black;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
}
</style>
</head>

<body>

<h2>Scanner Kehadiran</h2>

<div id="reader"></div>

<table>
<thead>
<tr>
<th>Nama</th>
<th>Jawatan</th>
<th>Masa</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>

const API = "https://script.google.com/macros/s/AKfycbwI1dGtenL6eWrnB5OyTv7HrNrRmk21qB6kOHGcHeIxGkcYlpzZ6ppo-FBVfuI-CU34FA/exec";

const data = JSON.parse(
  sessionStorage.getItem("mds_data")
);

let lock = false;

async function onScan(text){

  if(lock) return;

  lock = true;

  try{

    let qrData = text;

    try{
      qrData = JSON.parse(text).id;
    }catch(e){}

    let response = await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"application/x-www-form-urlencoded"
      },
      body:new URLSearchParams({
        action:"scan",
        nama:qrData,
        tarikh:data.tarikh,
        mesyuarat:data.mesyuarat
      })
    });

    let res = await response.json();

    if(!res.ok){
      alert(res.message);
      lock = false;
      return;
    }

    const d = res.data;

    let tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${d.nama}</td>
      <td>${d.jawatan}</td>
      <td>${d.masa}</td>
    `;

    document.getElementById("tbody")
      .prepend(tr);

    lock = false;

  }catch(err){

    console.log(err);

    lock = false;

  }
}

const scanner = new Html5Qrcode("reader");

scanner.start(
  { facingMode:"environment" },
  { fps:10, qrbox:250 },
  onScan
);

</script>

</body>
</html>
