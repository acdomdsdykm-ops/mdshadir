<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner MDS</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial;
  background:#022c22;
  color:#fff;
  text-align:center;
  margin:0;
}

#reader{
  width:320px;
  margin:10px auto;
}

#statusBox{
  width:300px;
  margin:10px auto;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}

.ready{background:#16a34a;}
.processing{background:#f59e0b;}
.success{background:#2563eb;}
.error{background:#dc2626;}

.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  color:#000;
  padding:18px;
  border-radius:12px;
  width:260px;
  opacity:0;
  visibility:hidden;
}

.popup.show{
  opacity:1;
  visibility:visible;
}
</style>
</head>

<body>

<h2>📷 Scanner Kehadiran</h2>

<div id="statusBox" class="ready">🟢 Sedia scan</div>

<div id="reader"></div>

<div id="popup" class="popup">
  <h3>✔ Berjaya</h3>
  <p id="nama"></p>
  <p id="jawatan"></p>
  <p id="bahagian"></p>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyVmoL7dvbMRm8dnpeKH8shzGBhgYKfJ2fFPkVBI45fpTab90IJFJOCJjy3NTvB8G0gAQ/exec";

let scanner;
let lock = false;

const statusBox = document.getElementById("statusBox");

function setStatus(c,t){
  statusBox.className = c;
  statusBox.innerText = t;
}

function showPopup(data){

  document.getElementById("nama").innerText = "Nama: " + (data.nama || "-");
  document.getElementById("jawatan").innerText = "Jawatan: " + (data.jawatan || "-");
  document.getElementById("bahagian").innerText = "Bahagian: " + (data.bahagian || "-");

  document.getElementById("popup").classList.add("show");

  setTimeout(()=>{
    document.getElementById("popup").classList.remove("show");
  },1500);
}

/* ================= CAMERA ================= */
function startQR(){

  scanner = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {

    if(!devices.length){
      setStatus("error","Kamera tidak jumpa");
      return;
    }

    let cam = devices[0];

    scanner.start(
      cam.id,
      { fps:10, qrbox:250 },
      onScan
    );

  });

}

/* ================= SCAN ================= */
function onScan(text){

  if(lock) return;
  lock = true;

  setStatus("processing","🟡 Memproses...");

  scanner.stop().catch(()=>{});

  fetch(API, {
    method: "POST",
    body: new URLSearchParams({
      action: "scan",
      nama: text
    })
  })
  .then(r => r.json())
  .then(res => {

    console.log(res);

    console.log("QR:", text);

    if(res.status === "error"){
      throw new Error(res.message);
    }

    setStatus("success","✔ Berjaya");

    showPopup(res);

    setTimeout(()=>{
      lock = false;
      setStatus("ready","🟢 Sedia scan");
      startQR();
    },1200);

  })
  .catch(err => {

  console.log(err);

  setStatus("error","❌ " + err.message);

  if(err.message.includes("tidak dijumpai")){
    showPopup({
      nama:"TIADA DATA",
      jawatan:"Semak QR",
      bahagian:"ID tidak wujud"
    },"ERROR");
  }

  lock = false;

  setTimeout(()=>{
    setStatus("ready","🟢 Sedia scan");
    startQR();
  },1500);
});

}

startQR();

</script>

</body>
</html>
