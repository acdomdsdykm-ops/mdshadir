<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Kehadiran MDS</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#064e3b,#022c22);
  color:white;
  text-align:center;
  margin:0;
}

/* CARD */
.box{
  background:white;
  color:black;
  margin:30px auto;
  padding:20px;
  border-radius:15px;
  width:320px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* INPUT */
input{
  width:90%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
  outline:none;
}

/* BUTTON */
button{
  padding:12px;
  width:95%;
  border:none;
  border-radius:8px;
  background:#16a34a;
  color:white;
  cursor:pointer;
  font-size:14px;
}

button:hover{
  background:#12833a;
}

/* STATUS */
.status{
  margin-top:10px;
  font-weight:bold;
  min-height:20px;
}

.success{color:green;}
.error{color:red;}
.warning{color:orange;}

/* INFO PANEL */
.info{
  font-size:13px;
  text-align:left;
  background:#f3f3f3;
  color:black;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h2>📷 Scanner Kehadiran MDS</h2>

<div class="box">

<!-- INFO MESYUARAT -->
<div class="info" id="info">
Loading session...
</div>

<!-- INPUT SCAN -->
<input id="ic" placeholder="Scan / IC / ID">

<button onclick="scan()">✔ Scan Kehadiran</button>

<div class="status" id="status"></div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbySRtR_Y4_jsH9d2uXf5qAh4T-EKiiFsnKl6C4ZqGqQp_OO8z5mjR99MWmKwwEhEc-Wyw/exec";

/* =========================
   GET SESSION DATA
========================= */
let session = JSON.parse(sessionStorage.getItem("mds_data"));

if(!session){
alert("Tiada session mesyuarat. Sila kembali ke dashboard.");
window.location.href="dashboard.html";
}

/* DISPLAY INFO */
document.getElementById("info").innerHTML = `
<b>📌 Mesyuarat:</b> ${session.mesyuarat}<br>
📅 <b>Tarikh:</b> ${session.tarikh}<br>
⏰ <b>Masa:</b> ${session.mula} - ${session.tamat}<br>
📍 <b>Tempat:</b> ${session.tempat}
`;

/* =========================
   ANTI DOUBLE SCAN KEY
========================= */
function getKey(ic){
return `mds_${ic}_${session.tarikh}_${session.mesyuarat}`;
}

function alreadyScanned(ic){
return localStorage.getItem(getKey(ic)) !== null;
}

function markScanned(ic){
localStorage.setItem(getKey(ic), "1");
}

/* =========================
   STATUS DISPLAY
========================= */
function showStatus(msg,type){

let el = document.getElementById("status");
el.innerText = msg;
el.className = "status " + type;

}

/* =========================
   SCAN FUNCTION
========================= */
async function scan(){

let ic = document.getElementById("ic").value.trim();

if(!ic){
showStatus("Sila scan IC / ID", "error");
return;
}

/* CHECK DUPLICATE */
if(alreadyScanned(ic)){
showStatus("⚠ Anda sudah scan untuk mesyuarat ini", "warning");
document.getElementById("ic").value="";
return;
}

showStatus("Merekod kehadiran...", "");

try{

let res = await fetch(API,{
method:"POST",
headers:{"Content-Type":"application/x-www-form-urlencoded"},
body:new URLSearchParams({
action:"scan",
ic:ic,
tarikh:session.tarikh,
mesyuarat:session.mesyuarat,
masa:new Date().toLocaleTimeString()
})
});

let data = await res.json();

if(data.success){

markScanned(ic);

showStatus("✔ Kehadiran direkodkan", "success");

document.getElementById("ic").value="";

}else{
showStatus("❌ Gagal rekod kehadiran", "error");
}

}catch(err){
console.error(err);
showStatus("Ralat server", "error");
}

}

/* ENTER KEY SUPPORT */
document.addEventListener("keydown", function(e){
if(e.key === "Enter"){
scan();
}
});

</script>

</body>
</html>
