<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Kehadiran MDS</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial;
  background:#022c22;
  color:white;
  text-align:center;
  margin:0;
}

/* INFO BOX */
.info{
  background:white;
  color:black;
  margin:10px auto;
  padding:12px;
  width:340px;
  border-radius:12px;
  font-size:13px;
  text-align:left;
  line-height:1.6;
}

/* SCANNER */
#reader{
  width:320px;
  margin:10px auto;
}

/* STATUS */
#statusBox{
  width:300px;
  margin:10px auto;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}

.ready{background:#16a34a;}
.processing{background:#f59e0b;}
.success{background:#2563eb;}
.error{background:#dc2626;}

/* TABLE */
.table-box{
  margin:15px;
  overflow-x:auto;
}

table{
  width:100%;
  background:white;
  color:black;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  font-size:13px;
}

th{
  background:#16a34a;
  color:white;
}

/* POPUP */
.popup{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:20px;
  border-radius:12px;
  opacity:0;
  visibility:hidden;
  transition:0.3s;
}
.popup.show{
  opacity:1;
  visibility:visible;
}

button{
  background:red;
  color:white;
  padding:10px;
  border:none;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>

<body>

<h2>📷 Scanner Kehadiran MDS</h2>

<div class="info" id="infoBox">Loading info...</div>

<div id="statusBox" class="ready">🟢 Sedia scan</div>

<div id="reader"></div>

<button onclick="back()">⬅️ Kembali</button>

<div class="table-box">
<table>
<thead>
<tr>
<th>Nama</th>
<th>Jawatan</th>
<th>Bahagian</th>
<th>Masa</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div id="popup" class="popup">
<h3 style="color:green;">✔ Berjaya</h3>
<p id="pNama" style="font-weight:bold;"></p>
<p id="pJawatan" style="font-weight:bold;"></p>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzW425dCcxwGVZVK3_93u9T_QlvdVnPEiJIHLkj2TZED0ZYL2NDLx5qVOXCZNriqarXMg/exec";

let data = JSON.parse(sessionStorage.getItem("mds_data") || "{}");

let scanner;
let lock = false;

const beep = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

function scanKey(id){
  return `mds_${data.mesyuarat}_${data.tarikh}_${id}`;
}

function alreadyScanned(id){
  return localStorage.getItem(scanKey(id));
}

function markScanned(id){
  localStorage.setItem(scanKey(id), "1");
}

function setStatus(type,msg){
  const statusBox = document.getElementById("statusBox");
  statusBox.className = type;
  statusBox.innerText = msg;
}

function restart(){
  setTimeout(() => {
    if(scanner){
      scanner.start({ facingMode:"environment" }, { fps:10, qrbox:250 }, onScan);
    }
  }, 800);
}

/* ================= SCAN HANDLER ================= */
function onScan(text){

  if(lock) return;
  lock = true;

  setStatus("processing","🟡 Memproses...");

  let qrData = text;

  // Jika QR JSON, auto parse
  try {
    let parsed = JSON.parse(text);
    qrData = parsed.id || parsed.nama || text;
  } catch(e){}

  if(alreadyScanned(qrData)){
    setStatus("error","⚠ Sudah scan");
    lock = false;
    restart();
    return;
  }

  fetch(API,{
    method:"POST",
    body:new URLSearchParams({
      action:"scan",
      nama: qrData,
      jawatan:"-",
      bahagian:"-",
      tarikh:data.tarikh,
      mesyuarat:data.mesyuarat
    })
  })
  .then(r=>r.json())
  .then(res=>{

    if(res.status === "error"){
      setStatus("error","❌ "+res.message);
      lock = false;
      restart();
      return;
    }

    markScanned(qrData);
    beep.play();

    document.getElementById("pNama").innerText = res.nama;
    document.getElementById("pJawatan").innerText = res.jawatan;

    document.getElementById("popup").classList.add("show");

    addRow(res);

    setStatus("success","✔ Berjaya");

    setTimeout(()=>{
      document.getElementById("popup").classList.remove("show");
      lock = false;
      setStatus("ready","🟢 Sedia scan");
      restart();
    },1200);

  })
  .catch(err=>{
    console.log(err);
    setStatus("error","❌ Server error");
    lock = false

</script>

</body>
</html>
