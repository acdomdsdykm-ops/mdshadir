<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Kehadiran MDS</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial;
  background:#022c22;
  color:white;
  text-align:center;
  margin:0;
}

/* INFO BOX */
.info{
  background:white;
  color:black;
  margin:10px auto;
  padding:12px;
  width:340px;
  border-radius:12px;
  font-size:13px;
  text-align:left;
  line-height:1.6;
}

/* SCANNER */
#reader{
  width:320px;
  margin:10px auto;
}

/* STATUS */
#statusBox{
  width:300px;
  margin:10px auto;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}

.ready{background:#16a34a;}
.processing{background:#f59e0b;}
.success{background:#2563eb;}
.error{background:#dc2626;}

/* TABLE */
.table-box{
  margin:15px;
  overflow-x:auto;
}

table{
  width:100%;
  background:white;
  color:black;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  font-size:13px;
}

th{
  background:#16a34a;
  color:white;
}

/* POPUP */
.popup{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:white;
  color:black;
  padding:20px;
  border-radius:12px;
  opacity:0;
  visibility:hidden;
}
.popup.show{
  opacity:1;
  visibility:visible;
}

button{
  background:red;
  color:white;
  padding:10px;
  border:none;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>

<body>

<h2>📷 Scanner Kehadiran MDS</h2>

<!-- 🔥 INFO MESYUARAT -->
<div class="info" id="infoBox">
Loading info mesyuarat...
</div>

<div id="statusBox" class="ready">🟢 Sedia scan</div>

<div id="reader"></div>

<button onclick="back()">⬅️ Kembali</button>

<div class="table-box">
<table>
<thead>
<tr>
<th>Nama</th>
<th>Jawatan</th>
<th>Bahagian</th>
<th>Masa</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div id="popup" class="popup">
<h3>✔ Berjaya</h3>
<p id="pNama"></p>
<p id="pJawatan"></p>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbyIchlFajTUl6XoMQtTDgQbRDVTeCYlxRyCsIkb-U051w4b9MNbDwrqMovgraCYhakjbA/exec";

let data = JSON.parse(sessionStorage.getItem("mds_data") || "{}");

let scanner;
let lock = false;

const beep = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

const statusBox = document.getElementById("statusBox");
const tbody = document.getElementById("tbody");
const popup = document.getElementById("popup");
const pNama = document.getElementById("pNama");
const pJawatan = document.getElementById("pJawatan");
const infoBox = document.getElementById("infoBox");

/* =========================
   CHECK SESSION
========================= */
if(!data.mesyuarat){
alert("Tiada data mesyuarat");
window.location.href="dashboard.html";
}

/* =========================
   DISPLAY INFO MESYUARAT
========================= */
infoBox.innerHTML = `
<b>📌 Nama Mesyuarat:</b> ${data.mesyuarat}<br>
📅 <b>Tarikh:</b> ${data.tarikh}<br>
⏰ <b>Masa:</b> ${data.mula} - ${data.tamat}<br>
📍 <b>Tempat:</b> ${data.tempat}
`;

/* =========================
   ANTI DOUBLE SCAN
========================= */
function scanKey(id){
return `mds_${id}_${data.tarikh}_${data.mesyuarat}`;
}

function alreadyScanned(id){
return localStorage.getItem(scanKey(id)) !== null;
}

function markScanned(id){
localStorage.setItem(scanKey(id),"1");
}

/* =========================
   STATUS
========================= */
function setStatus(type,msg){
statusBox.className = type;
statusBox.innerText = msg;
}

/* =========================
   TABLE
========================= */
function addRow(res){

let tr = document.createElement("tr");

tr.innerHTML = `
<td>${res.nama}</td>
<td>${res.jawatan}</td>
<td>${res.bahagian || "-"}</td>
<td>${res.masa}</td>
<td>${res.status}</td>
`;

tbody.prepend(tr);

}

/* =========================
   QR SCANNER
========================= */
function startQR(){

scanner = new Html5Qrcode("reader");

scanner.start(
  { facingMode:"environment" },
  { fps:10, qrbox:250 },
  text => {

    if(lock) return;
    lock = true;

    setStatus("processing","🟡 Memproses...");

    scanner.stop().catch(()=>{});

    if(alreadyScanned(text)){
      setStatus("error","⚠ Sudah scan mesyuarat ini");
      lock=false;
      startQR();
      return;
    }

    fetch(API,{
      method:"POST",
      body:JSON.stringify({
        nama:text,
        jawatan:"-",
        bahagian:"-",
        tarikh:data.tarikh,
        mesyuarat:data.mesyuarat
      })
    })
    .then(r=>r.json())
    .then(res=>{

      markScanned(text);

      beep.play();

      pNama.innerText = res.nama;
      pJawatan.innerText = res.jawatan;

      popup.classList.add("show");

      addRow(res);

      setStatus("success","✔ Berjaya");

      setTimeout(()=>{
        popup.classList.remove("show");
        lock=false;
        setStatus("ready","🟢 Sedia scan");
        startQR();
      },1200);

    })
    .catch(()=>{
      setStatus("error","❌ Error server");
      lock=false;
      startQR();
    });

  }
);

}

function back(){
window.location.href="dashboard.html";
}

startQR();

</script>

</body>
</html>
