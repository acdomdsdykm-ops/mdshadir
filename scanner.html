<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Kehadiran MDS</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#022c22;
  color:#fff;
  text-align:center;
  margin:0;
}

h2{
  margin:14px 0 8px;
}

.info{
  background:#fff;
  color:#000;
  margin:10px auto;
  padding:12px;
  width:340px;
  border-radius:12px;
  font-size:13px;
  text-align:left;
  line-height:1.6;
}

#reader{
  width:320px;
  margin:10px auto;
}

#statusBox{
  width:300px;
  margin:10px auto;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}

.ready{background:#16a34a;}
.processing{background:#f59e0b;}
.success{background:#2563eb;}
.error{background:#dc2626;}

.table-box{
  margin:15px;
  overflow-x:auto;
}

table{
  width:100%;
  background:#fff;
  color:#000;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  font-size:13px;
}

th{
  background:#16a34a;
  color:#fff;
}

.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  color:#000;
  padding:20px;
  border-radius:12px;
  opacity:0;
  visibility:hidden;
  transition:0.25s;
  min-width:220px;
}

.popup.show{
  opacity:1;
  visibility:visible;
}

button{
  background:red;
  color:#fff;
  padding:10px 14px;
  border:none;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>📷 Scanner Kehadiran MDS</h2>

<div class="info" id="infoBox">Loading info...</div>

<div id="statusBox" class="ready">🟢 Sedia scan</div>

<div id="reader"></div>

<button onclick="back()">⬅️ Kembali</button>

<div class="table-box">
  <table>
    <thead>
      <tr>
        <th>Nama</th>
        <th>Jawatan</th>
        <th>Bahagian</th>
        <th>Masa</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div id="popup" class="popup">
  <h3 style="color:green;">✔ Berjaya</h3>
  <p id="pNama" style="font-weight:bold;"></p>
  <p id="pJawatan" style="font-weight:bold;"></p>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycby4oC2rv2WUXwd7UlIcwKBOc15hXFXXE-7adUHxQcQ3xCkDEgsICuiD0y1vDcnIBuekXQ/exec";

let data = JSON.parse(sessionStorage.getItem("mds_data") || "{}");

if (!data.mesyuarat) {
  data = {
    mesyuarat: "Mesyuarat MDS",
    tarikh: "",
    mula: "",
    tamat: "",
    tempat: ""
  };
}

let scanner = null;
let lock = false;

const beep = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

const statusBox = document.getElementById("statusBox");
const tbody = document.getElementById("tbody");
const popup = document.getElementById("popup");
const pNama = document.getElementById("pNama");
const pJawatan = document.getElementById("pJawatan");
const infoBox = document.getElementById("infoBox");

infoBox.innerHTML = `
<b>📌 Nama Mesyuarat:</b> ${data.mesyuarat}<br>
📅 <b>Tarikh:</b> ${data.tarikh || "-"}<br>
⏰ <b>Masa:</b> ${data.mula || "-"} - ${data.tamat || "-"}<br>
📍 <b>Tempat:</b> ${data.tempat || "-"}
`;

function scanKey(id){
  return `mds_${id}_${data.tarikh}_${data.mesyuarat}`;
}

function alreadyScanned(id){
  return localStorage.getItem(scanKey(id)) !== null;
}

function markScanned(id){
  localStorage.setItem(scanKey(id),"1");
}

function setStatus(type,msg){
  statusBox.className = type;
  statusBox.innerText = msg;
}

function addRow(res){
  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td><b>${res.nama || ""}</b></td>
    <td>${res.jawatan || "-"}</td>
    <td>${res.bahagian || "-"}</td>
    <td>${res.masa || ""}</td>
    <td>${res.status || "Hadir"}</td>
  `;

  tbody.prepend(tr);
}

function restart(){
  setTimeout(() => {
    startQR();
  }, 700);
}

async function stopScanner(){
  if (scanner) {
    try {
      await scanner.stop();
    } catch(e) {}
    try {
      await scanner.clear();
    } catch(e) {}
    scanner = null;
  }
}

function startQR(){

  if (scanner || lock) return;

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode:"environment" },
    { fps:10, qrbox:250 },

    async text => {

      if (lock) return;
      lock = true;

      setStatus("processing","🟡 Memproses...");

      await stopScanner();

      if (alreadyScanned(text)) {
        setStatus("error","⚠ Sudah scan");
        lock = false;
        restart();
        return;
      }

      fetch(API, {
  method: "POST",
  body: new URLSearchParams({
    action: "scan",
    id: text,
    tarikh: data.tarikh,
    mesyuarat: data.mesyuarat
  })
})
.then(r => r.text())
.then(raw => {

  console.log("RAW RESPONSE:", raw);

  let res;
  try {
    res = JSON.parse(raw);
  } catch (err) {
    throw new Error("Response bukan JSON");
  }

  if (res.status === "error") {
    throw new Error(res.message || "Ralat server");
  }

  markScanned(text.trim().toUpperCase());

  pNama.innerText = res.nama || text;
  pJawatan.innerText = res.jawatan || "-";

  popup.classList.add("show");

  addRow({
    nama: res.nama || text,
    jawatan: res.jawatan || "-",
    bahagian: res.bahagian || "-",
    masa: res.masa || "",
    status: "Hadir"
  });

  setStatus("success", "✔ Berjaya");

  beep.play().catch(()=>{});

  setTimeout(() => {
    popup.classList.remove("show");
    setStatus("ready", "🟢 Sedia scan");
    lock = false;
    restart();
  }, 1200);

})
.catch(err => {
  console.log("SCAN ERROR:", err);
  setStatus("error", "❌ " + err.message);
  lock = false;
  restart();
});

function back(){
  window.location.href = "dashboard.html";
}

startQR();
</script>

</body>
</html>
