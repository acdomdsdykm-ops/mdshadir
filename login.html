<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Sistem Kehadiran MDS</title>

<style>

/* ================= BODY ================= */
body{
  font-family:Arial;
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#064e3b,#022c22);
  color:white;
}

/* ================= LOADING ================= */
.loading{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  background:rgba(0,0,0,0.65);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
}

.spinner{
  width:60px;
  height:60px;
  border:5px solid rgba(255,255,255,0.2);
  border-top:5px solid #10b981;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0);}
  100%{transform:rotate(360deg);}
}

/* ================= CARD ================= */
.card{
  width:360px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:20px;
  padding:25px;
  text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,0.4);
  position:relative;
  overflow:hidden;
}

/* watermark */
.card::before{
  content:"";
  position:absolute;
  width:320px;
  height:320px;
  background:url('mds.png') no-repeat center;
  background-size:contain;
  opacity:0.05;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* content above watermark */
.card > *{
  position:relative;
}

/* ================= LOGO ================= */
.logo{
  width:80px;
  margin-bottom:10px;
}

/* ================= TITLE ================= */
.title{
  font-size:16px;
  font-weight:bold;
}

.subtitle{
  font-size:12px;
  opacity:0.9;
}

.address{
  font-size:10px;
  opacity:0.8;
  margin-bottom:10px;
  line-height:1.4;
}

/* ================= SYSTEM LABEL ================= */
.system-label{
  font-size:13px;
  font-weight:bold;
  margin:10px 0;
  padding:8px;

  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.25);
  border-radius:10px;

  letter-spacing:0.5px;
}

/* ================= INPUT ================= */
input{
  width:90%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin:8px 0;
  outline:none;
  text-align:center;
}

/* ================= BUTTON ================= */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  margin-top:6px;
}

/* LOGIN */
.login-btn{
  background:#10b981;
  color:white;
}
.login-btn:hover{background:#0f9b7a;}

/* REPORT */
.report-btn{
  background:#3b82f6;
  color:white;
}
.report-btn:hover{background:#2563eb;}

/* QR */
.qr-btn{
  background:#f59e0b;
  color:white;
}
.qr-btn:hover{background:#d97706;}

/* ERROR */
#error{
  color:#ffb3b3;
  font-size:12px;
  margin-top:5px;
}

/* FOOTER */
.footer{
  font-size:10px;
  margin-top:10px;
  opacity:0.7;
}

</style>
</head>

<body>

<!-- LOADING -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <p>Memproses sistem...</p>
</div>

<!-- CARD -->
<div class="card">

  <!-- LOGO -->
  <img src="mds.png" class="logo">

  <!-- TITLE -->
  <div class="title">MAJLIS DAERAH SIMUNJAN</div>
  <div class="subtitle">Sistem Kehadiran Staf</div>

  <div class="address">
    Lot 805, Gunong Ngeli New Service Centre,<br>
    94800 Simunjan, Sarawak
  </div>

  <!-- SYSTEM LABEL -->
  <div class="system-label">
    Sistem Kehadiran Digital MDS
  </div>

  <!-- INPUT -->
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <!-- BUTTONS -->
  <button class="login-btn" onclick="login()">Login</button>
  <button class="report-btn" onclick="goReport()">🔍 Cari Report</button>
  <button class="qr-btn" onclick="goQR()">📱 QR Code Staf</button>

  <p id="error"></p>

  <div class="footer">
    © MDS Attendance System
  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzUy5zqYFKyteTPt4nIyWq-y2hjY0Inn2HLN6yQkCRVWha23E-3p2-o1QYo3vHcPOPRXQ/exec";

/* ================= LOADING ================= */
function showLoading(){
  document.getElementById("loading").style.display="flex";
}

function hideLoading(){
  document.getElementById("loading").style.display="none";
}

/* ================= LOGIN ================= */
async function login(){

  const user = document.getElementById("user").value.trim();
  const pass = document.getElementById("pass").value.trim();
  const error = document.getElementById("error");

  error.innerText="";

  if(!user || !pass){
    error.innerText="Sila isi username & password";
    return;
  }

  showLoading();

  try{

    let res = await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"application/x-www-form-urlencoded"
      },
      body:new URLSearchParams({
        action:"login",
        username:user,
        password:pass
      })
    });

    let data = await res.json();

    if(!data.success){
      error.innerText = data.message || "Login gagal";
      return;
    }

    sessionStorage.setItem("mds_login","true");
    sessionStorage.setItem("mds_user",JSON.stringify(data));

    window.location.href="dashboard.html";

  }catch(err){
    error.innerText="Ralat server / API";
    console.log(err);
  }finally{
    hideLoading();
  }

}

/* ================= REPORT ================= */
function goReport(){
  window.location.href="report.html";
}

/* ================= QR ================= */
function goQR(){
  window.location.href="ahli.html";
}

</script>

</body>
</html>
