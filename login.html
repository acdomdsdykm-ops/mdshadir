<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login MDS Premium</title>

<style>

body{
  font-family:Arial;
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#064e3b,#022c22);
}

/* BACKGROUND EFFECT */
body::before{
  content:"";
  position:fixed;
  width:300px;
  height:300px;
  background:rgba(255,255,255,0.08);
  top:-50px;
  left:-50px;
  border-radius:50%;
  filter:blur(30px);
}

body::after{
  content:"";
  position:fixed;
  width:250px;
  height:250px;
  background:rgba(16,185,129,0.15);
  bottom:-60px;
  right:-60px;
  border-radius:50%;
  filter:blur(30px);
}

/* CARD */
.card{
  width:360px;
  padding:25px;
  border-radius:18px;

  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.2);

  box-shadow:
    0 20px 40px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.2);

  text-align:center;
  color:white;
}

/* LOGO */
.logo{
  width:70px;
  margin-bottom:10px;
}

/* TITLE */
h2{
  margin:10px 0 5px;
  font-size:18px;
}

.sub{
  font-size:12px;
  opacity:0.8;
  margin-bottom:15px;
}

/* INPUT */
input{
  width:90%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  outline:none;
  font-size:14px;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
  transition:0.2s;
}

.login-btn{
  background:#10b981;
  color:white;
}
.login-btn:hover{
  background:#059669;
  transform:scale(1.02);
}

.report-btn{
  background:#3b82f6;
  color:white;
}
.report-btn:hover{
  background:#2563eb;
  transform:scale(1.02);
}

.qr-btn{
  background:#8b5cf6;
  color:white;
}
.qr-btn:hover{
  background:#7c3aed;
  transform:scale(1.02);
}

/* LOADING */
.loading{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
}

.spinner{
  width:55px;
  height:55px;
  border:4px solid rgba(255,255,255,0.3);
  border-top:4px solid #10b981;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

.small{
  font-size:11px;
  opacity:0.7;
  margin-top:10px;
}

</style>
</head>

<body>

<!-- LOADING -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <p>Login in progress, please wait...</p>
</div>

<!-- CARD -->
<div class="card">

  <!-- LOGO -->
  <img src="mds.png" class="logo">

  <h2>MAJLIS DAERAH SIMUNJAN</h2>
  <div class="sub">Sistem Kehadiran Rasmi MDS</div>

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <button class="login-btn" onclick="login()">Login</button>
  <button class="report-btn" onclick="goReport()">🔍 Cari Report</button>
  <button class="qr-btn" onclick="goQR()">📱 QRCode Staf</button>

  <div class="small">© MDS Attendance System</div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwUfYEUShEnVyld8GIeQTeY3STUDHvwK8QsIqah2D1vFNoup7NMupjsYh-z-6CExH75PA/exec";

/* LOADING */
function showLoading(){
  document.getElementById("loading").style.display="flex";
}
function hideLoading(){
  document.getElementById("loading").style.display="none";
}

/* LOGIN */
function login(){

  showLoading();

  fetch(API,{
    method:"POST",
    headers:{"Content-Type":"text/plain"},
    body:JSON.stringify({
      action:"login",
      user:user.value,
      pass:pass.value
    })
  })
  .then(r=>r.json())
  .then(res=>{

    hideLoading();

    if(!res.success){
      alert("Login gagal");
      return;
    }

    sessionStorage.setItem("mds_login","true");
    window.location.href="dashboard.html";

  })
  .catch(()=>{
    hideLoading();
    alert("Server error");
  });
}

/* NAV */
function goReport(){
  window.location.href="report.html";
}

function goQR(){
  window.location.href="ahli.html";
}

</script>

</body>
</html>
