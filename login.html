<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Staf MDS</title>

<style>

/* ================= BODY ================= */
body{
  font-family:Arial;
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#064e3b,#022c22);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* ================= CARD ================= */
.card{
  width:360px;
  background:rgba(255,255,255,0.10);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:20px;
  padding:20px;
  text-align:center;
  color:white;
  box-shadow:0 25px 60px rgba(0,0,0,0.4);
  position:relative;
  overflow:hidden;
}

/* ================= LOGO ================= */
.logo{
  width:70px;
  margin-bottom:5px;
}

/* ================= TEXT ================= */
.title{
  font-weight:bold;
  font-size:16px;
}

.address{
  font-size:11px;
  opacity:0.8;
}

/* ================= INPUT ================= */
input{
  width:90%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin:10px 0;
  outline:none;
}

/* ================= BUTTON ================= */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  background:#10b981;
  color:white;
  transition:0.2s;
}

button:hover{
  background:#0f9b7a;
}

/* ================= ERROR ================= */
#error{
  color:#ffb4b4;
  font-size:12px;
  margin-top:5px;
}

/* ================= PROFILE ================= */
#profile{
  display:none;
}

/* ================= ID CARD ================= */
.id-card{
  margin-top:15px;
  padding:20px;
  border-radius:15px;
  background:linear-gradient(135deg,#0f9b8e,#22c55e);
  position:relative;
  overflow:hidden;
}

/* watermark */
.id-card::before{
  content:"";
  position:absolute;
  width:320px;
  height:320px;
  background:url('mds.png') no-repeat center;
  background-size:contain;
  opacity:0.06;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* content above watermark */
.id-card > *{
  position:relative;
}

/* ================= NAME ================= */
.name{
  font-size:18px;
  font-weight:bold;
  background:rgba(255,255,255,0.2);
  padding:8px;
  border-radius:10px;
}

/* ================= INFO ================= */
.info{
  font-size:13px;
  font-weight:bold;
  margin-top:5px;
}

/* ================= QR ================= */
#qrcode{
  margin-top:12px;
  background:white;
  padding:10px;
  border-radius:10px;
  display:inline-block;
}

/* ================= LOADING OVERLAY ================= */
.loading{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(5px);

  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  z-index:99999;
  color:white;
}

.spinner{
  width:60px;
  height:60px;
  border:5px solid rgba(255,255,255,0.2);
  border-top:5px solid #10b981;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

</style>
</head>

<body>

<!-- LOADING -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <p>Sedang menyemak maklumat...</p>
</div>

<!-- CARD -->
<div class="card">

  <img src="mds.png" class="logo">

  <div class="title">MAJLIS DAERAH SIMUNJAN</div>
  <div class="address">
    QR CODE STAF KEHADIRAN
  </div>

  <!-- SEARCH -->
  <input id="icInput" placeholder="Masukkan 4 digit IC terakhir">

  <button onclick="searchIC()">Semak Maklumat</button>

  <p id="error"></p>

  <!-- PROFILE -->
  <div id="profile">

    <div class="id-card">

      <div class="name" id="nama">Nama</div>

      <div class="info" id="jawatan"></div>
      <div class="info" id="bahagian"></div>

      <div id="qrcode"></div>

      <p style="font-size:11px;margin-top:10px;">
        Sila tunjukkan QRCode ini kepada Urusetia untuk tujuan rekod kehadiran.
      </p>

    </div>

  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxi6lk4tgJeEP_TVKcgPQraY1sasPpVUml4Oa-LfcVEohLPKNZN-c10sTIJiqTnvkkYeA/exec";

/* ================= LOADING ================= */
function showLoading(){
  document.getElementById("loading").style.display="flex";
  document.body.style.overflow="hidden";
}

function hideLoading(){
  document.getElementById("loading").style.display="none";
  document.body.style.overflow="auto";
}

/* ================= SEARCH ================= */
function searchIC(){

  let ic = document.getElementById("icInput").value.trim();
  let error = document.getElementById("error");

  if(ic.length !== 4){
    error.innerText = "Sila masukkan 4 digit IC";
    return;
  }

  error.innerText="";
  showLoading();

  fetch(API+"?action=searchNama&ic="+ic)
  .then(r=>r.json())
  .then(res=>{

    hideLoading();

    if(!res.success){
      error.innerText = res.message || "Maklumat tidak sah";
      return;
    }

    document.getElementById("profile").style.display="block";

    document.getElementById("nama").innerText=res.nama;
    document.getElementById("jawatan").innerText=res.jawatan;
    document.getElementById("bahagian").innerText=res.bahagian;

    let qr = "https://api.qrserver.com/v1/create-qr-code/?size=170x170&data="
             + encodeURIComponent(res.id)
             + "&t=" + Date.now();

    document.getElementById("qrcode").innerHTML =
      `<img src="${qr}">`;

  })
  .catch(err=>{
    hideLoading();
    error.innerText="Server error";
  });

}

</script>

</body>
</html>
