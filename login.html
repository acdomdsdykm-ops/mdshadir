<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Sistem Kehadiran MDS</title>

<style>

body{
  font-family:Arial;
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#064e3b,#022c22);
  color:white;
  text-align:center;
}

/* TITLE */
h2{
  margin-top:60px;
}

/* LOGIN PANEL */
.panel{
  background:white;
  color:black;
  margin:40px auto;
  padding:20px;
  border-radius:12px;
  width:320px;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

/* INPUT */
input{
  width:95%;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:14px;
}

/* BUTTON BASE */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  color:white;
  cursor:pointer;
  font-weight:bold;
  margin-top:8px;
}

/* LOGIN BUTTON */
.login-btn{
  background:#3498db;
}
.login-btn:hover{
  background:#2980b9;
}

/* REPORT BUTTON */
.report-btn{
  background:#16a34a;
}
.report-btn:hover{
  background:#15803d;
}

/* QR BUTTON */
.qr-btn{
  background:#8b5cf6;
}
.qr-btn:hover{
  background:#7c3aed;
}

/* LOADING ANIMATION */
.loading{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
}

.spinner{
  width:55px;
  height:55px;
  border:5px solid #ccc;
  border-top:5px solid #10b981;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:10px;
}

@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

/* SMALL TEXT */
.small{
  font-size:12px;
  opacity:0.8;
}

</style>
</head>

<body>

<h2>🏢 Sistem Kehadiran MDS</h2>

<!-- LOADING -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <p>Login in progress, please wait...</p>
</div>

<!-- LOGIN PANEL -->
<div class="panel">

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <button class="login-btn" onclick="login()">Login</button>

  <button class="report-btn" onclick="goReport()">
    🔍 Cari Report
  </button>

  <button class="qr-btn" onclick="goQR()">
    📱 QRCode Staf MDS
  </button>

  <p class="small">Sistem rasmi Majlis Daerah Simunjan</p>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwUfYEUShEnVyld8GIeQTeY3STUDHvwK8QsIqah2D1vFNoup7NMupjsYh-z-6CExH75PA/exec";

/* LOADING */
function showLoading(){
  document.getElementById("loading").style.display="flex";
}

function hideLoading(){
  document.getElementById("loading").style.display="none";
}

/* LOGIN */
function login(){

  showLoading();

  fetch(API,{
    method:"POST",
    headers:{"Content-Type":"text/plain"},
    body:JSON.stringify({
      action:"login",
      user:user.value,
      pass:pass.value
    })
  })
  .then(r=>r.json())
  .then(res=>{

    hideLoading();

    if(!res.success){
      alert("Login gagal");
      return;
    }

    sessionStorage.setItem("mds_login","true");
    window.location.href="dashboard.html";

  })
  .catch(()=>{
    hideLoading();
    alert("Ralat sambungan server");
  });
}

/* REPORT PAGE */
function goReport(){
  window.location.href="report.html";
}

/* QR PAGE */
function goQR(){
  window.location.href="ahli.html";
}

</script>

</body>
</html>
