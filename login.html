<!DOCTYPE html>
<html lang="ms">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Sistem Kehadiran MDS</title>

<style>

/* ================= BODY ================= */
body{
  font-family:Arial;
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:linear-gradient(135deg,#064e3b,#022c22);
  color:white;
}

/* ================= LOADING ================= */
.loading{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100vh;
  background:rgba(0,0,0,0.65);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:9999;
}

.spinner{
  width:60px;
  height:60px;
  border:5px solid rgba(255,255,255,0.2);
  border-top:5px solid #2ecc71;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0);}
  100%{transform:rotate(360deg);}
}

/* ================= PANEL ================= */
.panel{
  background:white;
  color:black;
  width:330px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* ================= INPUT ================= */
input{
  width:95%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ccc;
  outline:none;
}

/* ================= BUTTON ================= */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  margin-top:6px;
}

/* LOGIN */
.login-btn{
  background:#3498db;
  color:white;
}
.login-btn:hover{background:#2980b9;}

/* REPORT */
.report-btn{
  background:#2ecc71;
  color:white;
}
.report-btn:hover{background:#27ae60;}

/* QR STAFF */
.qr-btn{
  background:#f39c12;
  color:white;
}
.qr-btn:hover{background:#d68910;}

/* ERROR */
#error{
  color:red;
  font-size:12px;
  margin-top:5px;
}

</style>
</head>

<body>

<!-- LOADING -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <p>Memproses...</p>
</div>

<h2>🏢 Sistem Kehadiran MDS</h2>

<div class="panel">

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <!-- LOGIN -->
  <button class="login-btn" onclick="login()">Login</button>

  <!-- REPORT -->
  <button class="report-btn" onclick="goReport()">🔍 Cari Report</button>

  <!-- QR CODE STAFF -->
  <button class="qr-btn" onclick="goQR()">📱 QRCode Staf</button>

  <p id="error"></p>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwUfYEUShEnVyld8GIeQTeY3STUDHvwK8QsIqah2D1vFNoup7NMupjsYh-z-6CExH75PA/exec";

/* ================= LOADING ================= */
function showLoading(){
  document.getElementById("loading").style.display="flex";
}

function hideLoading(){
  document.getElementById("loading").style.display="none";
}

/* ================= LOGIN ================= */
function login(){

  const user = document.getElementById("user").value.trim();
  const pass = document.getElementById("pass").value.trim();
  const error = document.getElementById("error");

  error.innerText="";

  if(!user || !pass){
    error.innerText="Sila isi username & password";
    return;
  }

  showLoading();

  fetch(API,{
    method:"POST",
    headers:{"Content-Type":"text/plain"},
    body:JSON.stringify({
      action:"login",
      user:user,
      pass:pass
    })
  })
  .then(r=>r.json())
  .then(res=>{

    hideLoading();

    if(!res.success){
      error.innerText="Login gagal";
      return;
    }

    sessionStorage.setItem("mds_login","true");
    sessionStorage.setItem("mds_user",JSON.stringify(res));

    window.location.href="dashboard.html";

  })
  .catch(()=>{
    hideLoading();
    error.innerText="Ralat server";
  });

}

/* ================= REPORT ================= */
function goReport(){
  window.location.href="report.html";
}

/* ================= QR CODE STAFF ================= */
function goQR(){
  window.location.href="ahli.html";
}

</script>

</body>
</html>
